name = "toolpano-forum"
main = "src/index.ts"
compatibility_date = "2025-10-01"

# Sitenin geri kalanı (Astro) olduğu gibi kalır; yalnız /forum altı bu Worker'a gider.
routes = [
  { pattern = "toolpano.com/forum*", zone_name = "toolpano.com" },
  { pattern = "www.toolpano.com/forum*", zone_name = "toolpano.com" },
  # Sitenin kök keşif dosyaları: Pages'teki asıl dosya alınır, foruma dair satırlar eklenir.
  { pattern = "toolpano.com/robots.txt", zone_name = "toolpano.com" },
  { pattern = "toolpano.com/sitemap-index.xml", zone_name = "toolpano.com" },
  { pattern = "toolpano.com/llms.txt", zone_name = "toolpano.com" }
]

rules = [{ type = "Data", globs = ["**/*.png"], fallthrough = false }]

[vars]
# IndexNow anahtarı gizli değildir; /forum/<anahtar>.txt adresinde yayımlanır.
INDEXNOW_KEY = "a2f812803956e4a829fb138089d7133c"

[[d1_databases]]
binding = "DB"
database_name = "toolpano-forum"
database_id = "db540d83-3df2-405d-8041-7121ccbaba69"

[triggers]
# Saatte bir: toolpano.com site haritasındaki yeni adresleri IndexNow'a bildir (src/site-indexnow.ts).
crons = ["23 * * * *"]

[observability]
enabled = true

# Gizli değerler (wrangler secret put ile):
#   ADMIN_TOKEN  yönetici uç noktaları için
#   IP_SALT      IP adreslerini özetlerken kullanılan tuz
