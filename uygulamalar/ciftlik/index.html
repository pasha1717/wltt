<title>Toprak Ağası</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Rubik:wght@400;500;600;700&display=swap">
<style>
/* Düzen: tarım işletmesi yönetim paneli; üst çubukta kasa ve takvim, altında ekran yığını (ana ekran, harita, ilçe, arazi, proje). Tek koyu tema. */
:root{
  --bg:#0e1511; --panel:#16201a; --panel2:#1c2921; --panel3:#233228; --line:#2d3f33; --ink:#e9efe6; --muted:#93a597; --dim:#647768;
  --gold:#e9b949; --gold-ink:#2b1f02; --green:#6fcf86; --red:#f0715f; --teal:#5fc4c9; --blue:#7aa8f0; --violet:#b796f0;
  --soil1:#7b5a32; --soil2:#5d4224;
  --display:"Sora","Segoe UI",system-ui,sans-serif; --body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
#app{height:100%;display:flex;flex-direction:column;max-width:1180px;margin:0 auto}
.gut{padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}

/* Üst çubuk */
.top{display:flex;align-items:center;gap:10px;padding-block:10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.back{display:flex;align-items:center;gap:6px;padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:var(--panel);font-weight:600;font-size:13px}
.ttl{min-width:0;flex:1}
.eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--green)}
.ttl h1{margin:0;font-family:var(--display);font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand{font-family:var(--display);font-weight:800;font-size:18px;color:var(--gold);line-height:1;letter-spacing:.02em}
.brand small{display:block;font-size:9.5px;color:var(--muted);letter-spacing:.16em;margin-top:3px}
.kasa{display:flex;align-items:baseline;gap:7px}
.kasa span{font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--green)}
.kasa b{font-family:var(--display);font-size:17px;font-weight:700}
.kasa b.neg{color:var(--red)}
.chip{display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-weight:600;font-size:12.5px;position:relative}
.chip .dayp{position:absolute;left:12px;right:12px;bottom:2px;height:2px;background:var(--line);border-radius:2px;overflow:hidden}
.chip .dayp i{display:block;height:100%;background:var(--gold)}
.ibtn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line)}
.pillbtn{padding:7px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-weight:600;font-size:12.5px;display:flex;gap:6px;align-items:center}
.pillbtn.gold{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}

#scr{flex:1;overflow-y:auto;overscroll-behavior:contain;padding-block:14px 28px}
.cols{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
@media (max-width:820px){.cols{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.lbl{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
h2{font-family:var(--display);font-size:16px;margin:0;font-weight:700}
.sub{color:var(--muted);font-size:12.5px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.btn{padding:10px 16px;border-radius:11px;font-weight:600;background:var(--panel2);border:1px solid var(--line)}
.btn.gold{background:linear-gradient(180deg,#f2c862,#d9a432);color:var(--gold-ink);border-color:#d9a432;font-weight:700}
.btn.green{background:var(--green);color:#082010;border-color:var(--green);font-weight:700}
.btn.sm{padding:7px 11px;font-size:12.5px;border-radius:9px}
.btn.wide{width:100%;padding:14px;font-size:15px;font-family:var(--display)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:active:not(:disabled){transform:translateY(1px)}

/* Ana ekran */
.firm h2{font-size:21px}
.firm .sub b{color:var(--green);font-weight:600}
.kasacard{background:linear-gradient(160deg,var(--panel3),var(--panel));border:1px solid var(--line);border-radius:16px;padding:16px}
.kasacard .big{font-family:var(--display);font-size:30px;font-weight:800;margin:2px 0 12px}
.kasacard .big.neg{color:var(--red)}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;border-top:1px solid var(--line);padding-top:10px}
.trio b{display:block;font-family:var(--display);font-size:14px;margin-top:2px}
.pos{color:var(--green)} .negc{color:var(--red)}
.taksit{display:flex;justify-content:space-between;gap:8px;padding:10px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--blue);font-size:13px}
.taksit b{color:var(--blue)}
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media (max-width:460px){.tiles{gap:6px}.tile{padding:10px 2px 8px}.tile b{font-size:11.5px}.tile small{font-size:9.5px}.tile svg{width:26px;height:26px}}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;position:relative}
.tile svg{width:30px;height:30px}
.tile b{font-size:13px;font-weight:600}
.tile small{font-size:10.5px;color:var(--gold);line-height:1.2}
.tile .dot{position:absolute;top:7px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--red)}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mini{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:12px;display:flex;gap:10px;text-align:left}
.mini .ico{width:38px;height:38px;border-radius:10px;background:var(--panel3);display:grid;place-items:center;flex:0 0 auto}
.mini b{display:block;font-size:14px}
.mini small{display:block;font-size:11.5px;color:var(--muted)}
.mini em{font-style:normal;font-size:12px;color:var(--gold);font-weight:600}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:10px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--c,var(--line));text-align:left;width:100%}
.prow b{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow small{grid-column:1;font-size:11.5px;color:var(--muted)}
.prow .bar{grid-column:1/-1}
.pill{justify-self:end;align-self:start;padding:3px 9px;border-radius:999px;font-size:10.5px;font-weight:700;letter-spacing:.06em;border:1px solid currentColor;color:var(--c,var(--muted));white-space:nowrap}
.pill.hot{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgb(233 185 73 / .18)}}
.bar{height:5px;border-radius:3px;background:var(--panel3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--green));border-radius:3px}
.cta{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-radius:16px;background:linear-gradient(110deg,#f3cb67,#d99f2c);color:var(--gold-ink);text-align:left;width:100%;overflow:hidden;position:relative}
.cta .lbl{color:#5b4206}
.cta b{font-family:var(--display);font-size:20px;font-weight:800}
.cta svg.tr{position:absolute;right:56px;top:6px;height:64px;opacity:.28}
.cta .go{width:34px;height:34px;border-radius:50%;background:rgb(0 0 0 / .14);display:grid;place-items:center;font-size:18px;flex:0 0 auto;position:relative}
.offer{border-left:3px solid var(--violet)}
.empty{padding:16px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-size:13px;text-align:center}

/* Harita */
.mapwrap{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;overflow:hidden}
.mapwrap svg{width:100%;height:auto;display:block}
.mapwrap path{fill:#2c3a31;stroke:#4a5e50;stroke-width:.9;cursor:pointer;transition:fill .15s}
.mapwrap path:hover{fill:#3b4d40}
.mapwrap path.open{fill:#c79b37;stroke:#f2cd72}
.mapwrap path.open:hover{fill:#dcae47}
.mapwrap path.sel{fill:var(--teal);stroke:#d6fbff;stroke-width:1.6}
.mapwrap path.mine{fill:#e9b949}
.maplegend{display:flex;gap:12px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.maplegend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.ilchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.ilchips button{flex:0 0 auto;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:12.5px;font-weight:500;white-space:nowrap}
.ilchips button.open{border-color:var(--gold);color:var(--gold)}
.ilchips button.sel{background:var(--teal);color:#05211f;border-color:var(--teal)}
.ilchips small{color:var(--dim);margin-right:4px}
.plate{display:inline-flex;align-items:stretch;border:2px solid #d9dee0;border-radius:6px;overflow:hidden;background:#f4f6f5;color:#14181a;font-family:var(--display);font-weight:800;font-size:18px}
.plate i{background:#2851b8;width:12px}
.plate span{padding:2px 9px}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kv div{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.kv b{display:block;font-family:var(--display);font-size:16px;margin-top:2px}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:700;letter-spacing:.05em;background:var(--panel3);color:var(--muted);border:1px solid var(--line)}
.tag.g{color:var(--green);border-color:#2f5a3b}
.tag.y{color:var(--gold);border-color:#6b5520}
.tag.t{color:var(--teal);border-color:#245558}
.crops{display:flex;flex-wrap:wrap;gap:5px}

/* İlçeler */
.ilcegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ilce{padding:11px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--c);text-align:left;display:flex;flex-direction:column;gap:3px}
.ilce b{font-size:14px;font-weight:600}
.ilce small{font-size:11.5px;color:var(--muted)}
.ilce .mk{font-size:11px;color:var(--gold);font-weight:600}

/* Arazi kartları */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.acard{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;text-align:left}
.acard.sold{opacity:.55}
.acard .pic{position:relative;background:#26332a}
.acard .pic svg{display:block;width:100%;height:auto}
.acard .pic .tag{position:absolute;left:8px;top:8px}
.acard .bd{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px}
.acard .size{font-family:var(--display);font-size:20px;font-weight:700}
.acard .price{font-family:var(--display);font-size:16px;color:var(--gold);font-weight:700}
.acard .meta{font-size:11.5px;color:var(--muted);border-top:1px solid var(--line);margin-top:6px;padding-top:6px;line-height:1.5}
.st{font-size:10.5px;font-weight:700;letter-spacing:.06em;padding:2px 8px;border-radius:999px;border:1px solid currentColor}
.st.ok{color:var(--green)} .st.no{color:var(--red)} .st.me{color:var(--gold)}

/* Proje tasarla */
.seg{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--panel);border:1px solid var(--line);overflow-x:auto}
.seg button{flex:1 0 auto;padding:7px 12px;border-radius:999px;font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap;display:flex;flex-direction:column;align-items:center;line-height:1.15}
.seg button small{font-size:9.5px;font-weight:500}
.seg button.on{background:var(--gold);color:var(--gold-ink)}
.seg button.lock{opacity:.5}
.scene{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#9cc7df}
.scene svg{display:block;width:100%;height:auto}
.sum{display:flex;flex-direction:column;gap:6px}
.sumline{display:flex;justify-content:space-between;gap:10px;font-size:13px}
.sumline span{color:var(--muted)}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
.total b{font-family:var(--display);font-size:22px;color:var(--gold)}
.sl{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.sl:last-child{border-bottom:0}
.sl .between b{color:var(--gold);font-weight:600}
input[type=range]{width:100%;accent-color:var(--green);height:22px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts button{padding:7px 10px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);font-size:12.5px;display:flex;align-items:center;gap:5px}
.opts button.on{border-color:var(--gold);color:var(--gold);background:var(--panel3)}
.opts button small{color:var(--muted)}
.opts button.weak{opacity:.75}
.don{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);text-align:left;width:100%}
.don.on{border-color:var(--gold);background:var(--panel3)}
.don .box{width:20px;height:20px;border-radius:6px;border:2px solid var(--dim);display:grid;place-items:center;font-size:13px;color:var(--gold-ink)}
.don.on .box{background:var(--gold);border-color:var(--gold)}
.don b{font-weight:600}
.don small{display:block;color:var(--muted);font-size:11.5px}
.err{color:var(--red);font-size:12.5px;font-weight:600}
.note{font-size:12px;color:var(--muted);line-height:1.45}

/* Liste satırları */
.lrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.lrow b{font-weight:600}
.lrow small{display:block;color:var(--muted);font-size:11.8px;margin-top:2px;line-height:1.4}
.lrow .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.log{display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.log div{padding:7px 10px;border-radius:9px;background:var(--panel2);color:var(--muted)}
.log div b{color:var(--ink);font-weight:500}
.cust{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-family:var(--display);color:var(--gold-ink)}
.tabs{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--panel);border:1px solid var(--line);overflow-x:auto}
.tabs button{padding:7px 14px;border-radius:999px;font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap}
.tabs button.on{background:var(--gold);color:var(--gold-ink)}
.rank{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.rank.me{border-color:var(--gold)}
.rank i{font-style:normal;font-family:var(--display);font-weight:800;color:var(--muted);text-align:center}

/* Pencere */
[hidden]{display:none!important}
#modal{position:fixed;inset:0;z-index:40;background:rgb(3 8 5 / .72);display:grid;place-items:center;padding:16px}
.mbox{width:min(460px,100%);max-height:calc(100% - 20px);overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 24px 60px rgb(0 0 0 / .5)}
.mbox h3{margin:0;font-family:var(--display);font-size:18px}
.bubble{padding:10px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-size:13.5px;line-height:1.45}
.bubble.me{background:#2a2410;border-color:#5b4a1b}
.wheel{width:240px;height:240px;margin:6px auto;position:relative}
.wheel .w{width:100%;height:100%;border-radius:50%;border:4px solid var(--gold);transition:transform 3.2s cubic-bezier(.17,.67,.2,1)}
.wheel .pin{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-top:20px solid var(--ink)}
.wheel .lab{position:absolute;left:50%;top:50%;width:50%;transform-origin:0 0;font-size:11px;font-weight:700;color:#1b1405;padding-left:30px}
#toasts{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;flex-direction:column-reverse;align-items:center;gap:6px;pointer-events:none;z-index:50}
.toast{max-width:min(92vw,480px);padding:10px 14px;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:500;font-size:13px;box-shadow:0 8px 22px rgb(0 0 0 / .4);animation:tin .2s ease-out}
.toast.ev{background:var(--gold);color:var(--gold-ink)}
.toast.bad{background:var(--red);color:#2a0702}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app">
  <div class="top gut" id="top"></div>
  <main id="scr" class="gut"></main>
</div>
<div id="modal" hidden></div>
<div id="toasts"></div>

<script src="iller.js"></script>
<script>
"use strict";
/* ================= Sabitler ================= */
const GUN=45000;                 // bir oyun günü (ms)
const OFFLINE_MAX=30;            // kapalıyken en çok işlenen gün
const SAVE_KEY="toprakAgasi.v1";
const GUNLER=["Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi","Pazar"];
const BOLGE={"marmara":"Marmara","ege":"Ege","akdeniz":"Akdeniz","ic-anadolu":"İç Anadolu","karadeniz":"Karadeniz","dogu-anadolu":"Doğu Anadolu","guneydogu-anadolu":"Güneydoğu Anadolu"};
const RK={mar:"marmara",ege:"ege",akd:"akdeniz",ic:"ic-anadolu",kar:"karadeniz",dog:"dogu-anadolu",gd:"guneydogu-anadolu"};
const BOLGE_FIYAT={"marmara":170000,"ege":145000,"akdeniz":155000,"ic-anadolu":58000,"karadeniz":110000,"dogu-anadolu":34000,"guneydogu-anadolu":48000};
const METRO={34:3,6:1.4,35:1.8,7:1.6,16:1.5,41:1.8,59:1.3,54:1.4};
const BASLANGIC_IL=42;

// Ürünler. kg: dönüm başına verim, f: ₺/kg, mal: dönüm başına gider, gun: kurulumdan ilk hasada gün
const URUN={
  bugday:{ad:"Buğday",ic:"🌾",tip:"tarla",kg:450,f:13,mal:3200,gun:4,sulu:0,b:["ic","mar","gd","dog"],il:[42,26,6,21],renk:"#d8b552"},
  arpa:{ad:"Arpa",ic:"🌾",tip:"tarla",kg:420,f:11,mal:2800,gun:3.5,sulu:0,b:["ic","dog","gd"],il:[42,6,51,40],renk:"#cdb86a"},
  misir:{ad:"Mısır",ic:"🌽",tip:"tarla",kg:1150,f:12,mal:7200,gun:4.5,sulu:1,b:["akd","kar","ege","mar"],il:[1,80,55,72],renk:"#e1c440"},
  aycicegi:{ad:"Ayçiçeği",ic:"🌻",tip:"tarla",kg:300,f:25,mal:4300,gun:4,sulu:0,b:["mar"],il:[22,39,59],renk:"#f0c22b"},

function plan(D){
  const a=S.arsalar.find(x=>x.id===D.arsa);const P={alan:0,base:0,don:0,gun:0,err:"",tip:D.tip,kalem:[]};
  const verimM=(1+pers("muhendis"))*(S.makine.drone?1.05:1);const gunM=(1-pers("mudur"))*((D.tip==="tarla"||D.tip==="bahce")&&S.makine.traktor?.9:1);
  const hayM=(1+pers("veteriner"))*(D.don.otomasyon?1.12:1)*(D.don.biyogaz?1.1:1)*(D.don.gunes?1.08:1);
  const kuru=a.su==="kuru"&&!D.don.kuyu;const soil=[1.15,1,.85,.7][a.cls];
  P.fm=(D.don.iyi?1.08:1)*(D.don.soguk?1.1:1);
  if(D.tip==="tarla"||D.tip==="bahce"||D.tip==="sera"){
    const c=URUN[D.urun];P.urun=D.urun;P.fit=fit(D.urun,a.il);P.alan=clamp(D.alan,1,a.donum);
    if(D.tip==="sera"){
      const tc=[220000,520000,850000][D.seraTip],ty=[1,1.3,1.65][D.seraTip],ic=[0,140000][D.isi],iy=[1,1.25][D.isi];
      if(kuru)P.err="Arazide su yok. Sera için sondaj kuyusu ekle.";
      P.base=P.alan*(tc+ic);P.gun=c.gun*gunM;P.tekrar=c.tekrar;P.kg=P.alan*c.kg*P.fit*ty*iy*verimM;P.op=P.alan*c.mal*(D.don.gunes?.7:1);
    }else{
      const sy=[c.sulu?.4:.78,1,1.1,1.22][D.sulama],sc=[0,350,900,1500][D.sulama],qy=[.9,1,1.2][D.kalite],qc=[.8,1,1.45][D.kalite];
      if(kuru&&D.sulama>0)P.err="Arazide su yok. Sulu tarım için sondaj kuyusu ekle ya da kuru tarım seç.";
      if(D.tip==="tarla"){P.base=P.alan*(c.mal*qc+sc);P.gun=c.gun*gunM;P.kg=P.alan*c.kg*P.fit*soil*qy*sy*verimM*(S.makine.bicer?1.06:1)}
      else{P.base=P.alan*(c.fidan*qc+sc*3);P.gun=c.gun*gunM;P.tekrar=c.tekrar;P.kg=P.alan*c.kg*P.fit*soil*qy*sy*verimM;P.op=P.alan*c.mal*(D.don.gunes?.7:1)}
    }
    P.gelir=P.kg*c.f*fiyatM(D.urun)*P.fm;
  }else if(D.tip==="sut"){
    const max=a.donum*5;P.adet=clamp(D.adet,1,max);P.max=max;const ic=[75000,115000,170000][D.irk],sc=[0,450000,2600000][D.sagim],sm=[1,1.12,1.28][D.sagim];
    P.base=P.adet*(ic+22000)+sc;P.gun=3*gunM;P.net=P.adet*(ic+22000)*.021*sm*hayvanFit("sut",a.il)*hayM;P.litre=P.adet*[12,22,32][D.irk];
  }else if(D.tip==="besi"){
    const max=a.donum*8;P.adet=clamp(D.adet,1,max);P.max=max;const dc=[42000,65000,90000][D.irk],ye=[7000,8500,10000][D.irk];
    P.base=P.adet*(dc+ye+14000);P.yenile=P.adet*(dc+ye);P.gun=[8,7,6][D.irk]*gunM;P.birim=[66000,104000,146000][D.irk]*hayvanFit("besi",a.il)*hayM;P.gelir=P.adet*P.birim;
  }else if(D.tip==="kanatli"){
    const max=a.donum*2;P.adet=clamp(D.adet,1,max);P.max=max;const kc=[70000,130000][D.kumes];
    P.base=P.adet*(95000+kc);P.gun=2.5*gunM;P.net=P.adet*(95000+kc)*.024*(D.kumes?1.12:1)*hayM;
  }
  if(S.indirim)P.indirim=Math.round(P.base*S.indirim);
  for(const k in DONATI){const d=DONATI[k];if(!d.t.includes(D.tip)||!D.don[k])continue;if(k==="kuyu"&&a.su!=="kuru")continue;const c=d.c(P);P.don+=c;P.kalem.push([d.ad,c])}
  P.toplam=Math.round(P.base-(P.indirim||0)+P.don);P.arsa=a;
  return P}

  }

    else if(r<.3&&p.tip!=="sera"){m=sig?"Zirai don oldu. Sigorta ödedi.":"Zirai don vurdu (verim -%15).";if(!sig)p.mult=(p.mult||1)*.85}

    else if(r<.72){const z=Math.round(p.yatirim*.05);S.kasa-=z;m=`Gübre ve mazot zamlandı. Ek gider: ${tl(z)}`}
    else if(r<.84&&p.durum==="kurulum"){p.sure+=.5;m="Mevsimlik işçi bulunamadı, iş yarım gün uzadı."}

  }else if(hay&&p.durum!=="bitti"){

    if(r<.3){if(sig||S.personel.veteriner>=2)m="Bölgede şap salgını var. Önlemlerin sayesinde sürü sağlam.";else{p.dur=now()+2;m="Şap salgını: 2 gün üretim durdu. Uzman veteriner ya da sigorta koruyabilirdi.";if(p.tip==="besi")p.birim*=.92}}

    else{const z=Math.round(p.yatirim*.025);para(z);m=`Hayvancılık desteği hesaba yattı: ${tl(z)}`}

  p.musteri.push({id:uid(),ad,firma:fir,qty:Math.min(qty,p.stok),teklif:mp*rnd(.8,.93),max:mp*rnd(.97,1.12)*(1+pers("satis")/2)*(p.don&&p.don.depo?1.04:1),sabir:3,bitis:now()+rnd(1.5,2.5),c:`hsl(${hsh(ad)%360} 60% 65%)`});

  p.stok-=qty;para(net);p.ciro=(p.ciro||0)+net;S.stat.satis+=net;log(p,`${kim}: ${p.tip==="besi"?qty+" baş":ton(qty)} × ${tl(fiyat)} = ${tl(brut)} (stopaj${p.yari?" ve ortak payı":""} sonrası ${tl(net)})`);

function araziSVG(a,w){const R=rng(a.seed||hsh(a.id)),soil=["#6f4f2a","#7d5b31","#8d6d40","#a08560"][a.cls],line=["#5a3e1f","#664824","#735630","#857048"][a.cls];

  const fw=Math.min(190,70+Math.sqrt(a.donum)*11),fx=(220-fw)/2;
  s+=`<rect x="${fx}" y="14" width="${fw}" height="76" fill="${soil}" stroke="#e9e3c0" stroke-width="1.5" stroke-dasharray="4 3"/>`;
  for(let y=20;y<88;y+=6)s+=`<path d="M${fx+3} ${y}h${fw-6}" stroke="${line}" stroke-width="1.6"/>`;
  if(a.su==="kanal")s+=`<path d="M0 8 C60 14 120 2 220 9" stroke="#5fb3dd" stroke-width="5" fill="none"/>`;
  if(a.su==="kuyu")s+=`<circle cx="${fx+fw-12}" cy="24" r="6" fill="#3a6f8f" stroke="#cfe6f0" stroke-width="1.5"/>`;
  for(let i=0;i<4;i++){const x=R()<.5?R()*(fx-8)+4:fx+fw+R()*(220-fx-fw-8)+4;if(x>4&&x<216)s+=`<circle cx="${x}" cy="${20+R()*64}" r="${5+R()*4}" fill="#3f6b33"/>`}
  s+=`<rect x="${fx+fw/2-26}" y="44" width="52" height="18" rx="9" fill="rgb(0 0 0 / .55)"/><text x="${fx+fw/2}" y="57" text-anchor="middle" font-size="11" font-weight="700" fill="#fff" font-family="Rubik,sans-serif">${a.donum} dönüm</text>`;
  return s+`</svg>`}

function tasarimVarsayilan(a){const best=t=>Object.keys(URUN).filter(k=>URUN[k].tip===t).sort((x,y)=>fit(y,a.il)-fit(x,a.il))[0];
  return{arsa:a.id,tip:"tarla",urun:best("tarla"),alan:a.donum,kalite:1,sulama:a.su==="kuru"?0:1,seraTip:0,isi:0,adet:Math.max(1,Math.round(a.donum*1.5)),irk:1,sagim:0,kumes:0,don:{},adim:1}}
function sceneSVG(D,P){const c=URUN[D.urun];let s=`<svg viewBox="0 0 400 170" role="img" aria-label="Proje önizleme"><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fb4d6"/><stop offset="1" stop-color="#cfe3ea"/></linearGradient></defs><rect width="400" height="170" fill="url(#sky)"/><circle cx="340" cy="34" r="16" fill="#f6dd8a"/><path d="M0 92 Q80 70 170 88 T400 80 V170 H0z" fill="#7da35f"/>`;
  if(D.tip==="tarla"||D.tip==="bahce"){const rows=Math.min(9,3+Math.round(P.alan/12));
    for(let r=0;r<rows;r++){const y=100+r*(66/rows);s+=`<path d="M${10+r*4} ${y}H${390-r*4}" stroke="#6b4a26" stroke-width="${3+r*.4}"/>`;
      const n=D.tip==="bahce"?7+r:18+r*2;for(let i=0;i<n;i++){const x=14+r*4+i*(372-r*8)/n;
        s+=D.tip==="bahce"?`<rect x="${x+3}" y="${y-10-r}" width="2" height="${8+r}" fill="#5b3b1c"/><circle cx="${x+4}" cy="${y-13-r*1.4}" r="${5+r*.8}" fill="#3f7a3a"/><circle cx="${x+6}" cy="${y-12-r}" r="1.8" fill="${c.renk}"/>`:`<path d="M${x} ${y}l2 -${6+r} 2 ${6+r}" fill="${c.renk}"/>`}}}
  else if(D.tip==="sera"){const n=Math.min(8,Math.max(1,Math.round(P.alan/2)));const w=360/n;for(let i=0;i<n;i++){const x=20+i*w;s+=`<path d="M${x+3} 150 V112 Q${x+w/2} 84 ${x+w-3} 112 V150z" fill="${["#e8f2f2","#cfe8ee","#d8eef0"][D.seraTip]}" stroke="#9fb9bf" opacity=".92"/>`;for(let k=0;k<3;k++)s+=`<circle cx="${x+w*(.3+k*.2)}" cy="138" r="3" fill="${c.renk}"/>`}}
  else{const n=Math.min(40,P.adet||1),col=D.tip==="kanatli"?"#f4efe4":D.tip==="sut"?"#f2f2f2":"#8a5a34";
    s+=`<rect x="40" y="88" width="150" height="56" fill="#9c4f35"/><path d="M32 90 L115 58 L198 90z" fill="#6b3324"/><rect x="100" y="112" width="30" height="32" fill="#f1e5c8"/>`;
    if(D.tip==="kanatli")s+=`<rect x="210" y="96" width="160" height="48" fill="#d9c9a0"/><path d="M204 98 L290 74 L376 98z" fill="#a08a5a"/>`;
    for(let i=0;i<n;i++){const x=215+(i%10)*17,y=118+Math.floor(i/10)*12;s+=D.tip==="kanatli"?`<circle cx="${x}" cy="${y+22}" r="3" fill="${col}"/>`:`<ellipse cx="${x}" cy="${y+18}" rx="7" ry="4.5" fill="${col}" stroke="#333" stroke-width=".6"/>${D.tip==="sut"?`<circle cx="${x+2}" cy="${y+17}" r="1.6" fill="#222"/>`:""}`}}
  return s+`</svg>`}
function sl(id,label,val,min,max,step,show){return`<div class="sl"><div class="between"><span>${label}</span><b>${show}</b></div><input type="range" id="${id}" data-i="${id}" min="${min}" max="${max}" step="${step}" value="${val}"></div>`}

EKRAN.tasarla=p=>{const D=p.D,a=S.arsalar.find(x=>x.id===D.arsa),P=plan(D);
  if(D.adim===2){const list=Object.entries(DONATI).filter(([k,d])=>d.t.includes(D.tip)&&!(k==="kuyu"&&a.su!=="kuru"));
    return`<div class="cols"><div class="col"><div class="note">Donatılar maliyeti artırır ama verimi, fiyatı ve güvenliği yükseltir. Seçtiğin her şey toplam yatırıma anında eklenir.</div>${list.map(([k,d])=>`<button class="don ${D.don[k]?"on":""}" data-a="don" data-k="${k}"><span class="box">${D.don[k]?"✓":""}</span><span><b>${d.ad}</b><small>${d.d}</small></span><span class="num">${tl(d.c(P),1)}</span></button>`).join("")}</div>
    <div class="col">${ozet(D,P)}<button class="btn gold wide" data-a="kur" ${P.err?"disabled":""}>Projeyi başlat · ${tl(P.toplam,1)}</button></div></div>`}
  const segs=Object.entries(TIPLER).map(([k,t])=>{const lk=t.lvl>S.ofis;return`<button class="${D.tip===k?"on":""} ${lk?"lock":""}" data-a="dtip" data-k="${k}">${lk?"🔒 ":""}${t.ad}${lk?`<small>${OFIS[t.lvl].ad}</small>`:""}</button>`}).join("");
  let ctl="";

    ctl+=`<div class="sl"><span>Ürün</span><div class="opts">${Object.entries(URUN).filter(([,u])=>u.tip===D.tip).map(([k,u])=>{const f=fit(k,a.il);return opt("urun",k,u.ic+" "+u.ad,f>1?"★":f<1?"zayıf":"",D.urun===k,f<1)}).join("")}</div></div>`;
    ctl+=sl("alan",D.tip==="sera"?"Sera alanı":"Ekim alanı",P.alan,1,a.donum,1,P.alan+" dönüm");
    if(D.tip==="sera"){ctl+=`<div class="sl"><span>Sera tipi</span><div class="opts">${["Plastik","Cam","Topraksız (hidroponik)"].map((x,i)=>opt("seraTip",i,x,"",D.seraTip===i)).join("")}</div></div>`;
      ctl+=`<div class="sl"><span>Isıtma</span><div class="opts">${["Yok","Jeotermal"].map((x,i)=>opt("isi",i,x,i?"+%25 verim":"",D.isi===i)).join("")}</div></div>`}
    else{ctl+=`<div class="sl"><span>${D.tip==="bahce"?"Fidan":"Tohum"}</span><div class="opts">${(D.tip==="bahce"?["Yerli","Aşılı","Sertifikalı"]:["Yerli","Sertifikalı","Hibrit"]).map((x,i)=>opt("kalite",i,x,["-%10 verim","","+%20 verim"][i],D.kalite===i)).join("")}</div></div>`;
      ctl+=`<div class="sl"><span>Sulama</span><div class="opts">${["Kuru tarım","Salma","Yağmurlama","Damla"].map((x,i)=>opt("sulama",i,x,i===0&&URUN[D.urun].sulu?"bu ürün su ister":"",D.sulama===i,i===0&&URUN[D.urun].sulu)).join("")}</div></div>`}
  }else if(D.tip==="sut"){ctl+=sl("adet","İnek sayısı",P.adet,1,P.max,1,P.adet+" baş")+`<div class="sl"><span>Irk</span><div class="opts">${["Yerli kara","Melez","Holstein"].map((x,i)=>opt("irk",i,x,["12 L/gün","22 L/gün","32 L/gün"][i],D.irk===i)).join("")}</div></div><div class="sl"><span>Sağım</span><div class="opts">${["Elle","Sağım makinesi","Sağım robotu"].map((x,i)=>opt("sagim",i,x,["","+%12","+%28"][i],D.sagim===i)).join("")}</div></div>`}
  else if(D.tip==="besi"){ctl+=sl("adet","Dana sayısı",P.adet,1,P.max,1,P.adet+" baş")+`<div class="sl"><span>Irk</span><div class="opts">${["Yerli","Montofon melezi","Simental"].map((x,i)=>opt("irk",i,x,["8 gün","7 gün","6 gün"][i],D.irk===i)).join("")}</div></div>`}
  else if(D.tip==="kanatli"){ctl+=sl("adet","Kümes kapasitesi",P.adet,1,P.max,1,P.adet+" bin tavuk")+`<div class="sl"><span>Sistem</span><div class="opts">${["Kafes","Serbest gezen"].map((x,i)=>opt("kumes",i,x,i?"+%12 fiyat":"",D.kumes===i)).join("")}</div></div>`}
  return`<div class="cols"><div class="col"><div class="seg">${segs}</div><div class="scene">${sceneSVG(D,P)}</div>${ozet(D,P)}</div>
    <div class="col"><div class="panel">${ctl}</div>${P.err?`<div class="err">${P.err}</div>`:""}<div class="note">${a.donum} dönüm · ${["I","II","III","IV"][a.cls]}. sınıf toprak · ${SU[a.su]} · ${IL[a.il].n} (${BOLGE[IL[a.il].r]})</div><button class="btn gold wide" data-a="adim2">Donatıları seç →</button></div></div>`};
function ozet(D,P){const lines=[];
  if(P.urun){const u=URUN[P.urun];lines.push(["Bölge uyumu",P.fit>1?"Yöresel ürün (+%20)":P.fit<1?"Uygun değil (-%40)":"Uygun"]);
    lines.push([P.tekrar?"Hasat başına ürün":"Beklenen hasat",`${ton(P.kg)} × ${tl(u.f*fiyatM(P.urun)*P.fm)}`]);
    lines.push([P.tekrar?"Hasat başına ciro":"Tahmini ciro",tl(P.gelir)]);if(P.op)lines.push(["Hasat başına gider",tl(P.op)]);
    lines.push(["İlk hasat",gunTxt(P.gun)+(P.tekrar?` · sonra ${P.tekrar} günde bir`:"")])}
  else if(D.tip==="besi"){lines.push(["Besi süresi",gunTxt(P.gun)]);lines.push(["Satış değeri",`${P.adet} × ${tl(P.birim*fiyatM("et"))}`]);lines.push(["Tahmini ciro",tl(P.gelir*fiyatM("et"))]);lines.push(["Yeni dönem maliyeti",tl(P.yenile)])}
  else{lines.push(["Kurulum",gunTxt(P.gun)]);if(P.litre)lines.push(["Günlük süt",nf(P.litre)+" L"]);lines.push(["Günlük net gelir",`<span class="pos">+${tl(P.net)}</span>`]);lines.push(["Geri dönüş",Math.round(P.toplam/P.net)+" gün"])}
  return`<div class="panel sum"><div class="between"><b>${P.alan?P.alan+" dönüm":P.adet+(D.tip==="kanatli"?" bin tavuk":" baş")} · ${gunTxt(P.gun)}</b>${S.makine.traktor&&["tarla","bahce"].includes(D.tip)?'<span class="tag g">Traktör -%10</span>':""}</div>

    <div class="sumline"><span>Kurulum maliyeti</span><b class="num">${tl(P.base)}</b></div>${P.indirim?`<div class="sumline"><span>Çark indirimi</span><b class="pos num">-${tl(P.indirim)}</b></div>`:""}
    ${P.kalem.map(k=>`<div class="sumline"><span>${k[0]}</span><b class="num">${tl(k[1])}</b></div>`).join("")}

/* ================= Pencereler ================= */
function pencere(h){M=h;const m=$("#modal");if(!h){m.hidden=true;m.innerHTML="";return}m.hidden=false;m.innerHTML=`<div class="mbox" role="dialog" aria-modal="true">${h}</div>`}
function pazarlikPenceresi(pid,mid,mesaj){const p=S.projeler.find(x=>x.id===pid),m=p&&p.musteri.find(x=>x.id===mid);if(!m){pencere(null);return}
  const mp=birimFiyat(p),u=birimAd(p),q=m.qty;const def=M&&M.startsWith?null:null;
  const v=pazarlikPenceresi.v&&pazarlikPenceresi.m===mid?pazarlikPenceresi.v:Math.round(Math.max(m.teklif*1.08,mp)*100)/100;
  pazarlikPenceresi.m=mid;pazarlikPenceresi.v=v;
  pencere(`<div class="row"><span class="av" style="background:${m.c}">${m.ad[0]}</span><div><h3>${esc(m.ad)}</h3><div class="sub">${esc(m.firma)} · sabrı ${"●".repeat(m.sabir)}${"○".repeat(3-m.sabir)}</div></div></div>
    <div class="bubble">${mesaj||`${p.tip==="besi"?q+" baş danan":ton(q)+" "+URUN[p.urun].ad.toLowerCase()}a talibim. ${u} başına <b>${tl(m.teklif)}</b> veririm.`}</div>
    <div class="sumline"><span>Piyasa fiyatı</span><b class="num">${tl(mp)}/${u}</b></div>
    <div class="sumline"><span>Tüccarın teklifi</span><b class="num">${tl(m.teklif)} · toplam ${tl(m.teklif*q,1)}</b></div>
    <div class="sl"><div class="between"><span>Senin fiyatın</span><b id="pzv" class="num">${tl(v)} · toplam ${tl(v*q,1)}</b></div><input type="range" id="pz" data-i="pz" min="${(m.teklif).toFixed(2)}" max="${(mp*1.35).toFixed(2)}" step="${(mp/200).toFixed(3)}" value="${v}"></div>
    <div class="note">Satıştan %${(stopaj()*100).toFixed(1).replace(".",",")} stopaj kesilir${p.yari?`, ürünün %${Math.round(p.yari*100)}'i arazi sahibine gider`:""}.</div>
    <div class="row"><button class="btn" data-a="pzred">Gönder</button><button class="btn" data-a="pzkarsi">Karşı teklif ver</button><button class="btn gold" data-a="pzkabul">Kabul et</button></div>`);
  M={t:"pz",pid,mid}}
function pazarlikKarsi(){const p=S.projeler.find(x=>x.id===M.pid),m=p.musteri.find(x=>x.id===M.mid);const v=+$("#pz").value;pazarlikPenceresi.v=v;
  if(v<=m.max){sat(p,m.qty,v,m.ad);p.musteri=p.musteri.filter(x=>x.id!==m.id);toast(`Anlaştınız: ${tl(v)}/${birimAd(p)}`,"ev");pencere(null);ciz(1);return}
  m.sabir--;if(m.sabir<=0){p.musteri=p.musteri.filter(x=>x.id!==m.id);log(p,`${m.ad} pazarlıkta anlaşamayıp gitti.`);pencere(`<h3>${esc(m.ad)} gitti</h3><div class="bubble">"Bu fiyata alırsam ben zarar ederim. Kolay gelsin."</div><button class="btn gold" data-a="kapatm">Tamam</button>`);dirty=1;return}
  m.teklif=Math.min(m.max*.99,m.teklif+(v-m.teklif)*rnd(.3,.55));
  pazarlikPenceresi(p.id,m.id,pick([`Olmaz öyle, piyasa belli. Son sözüm <b>${tl(m.teklif)}</b>.`,`Biraz insaf! <b>${tl(m.teklif)}</b> diyelim, tamam mı?`,`Nakliyesi de bana kalıyor. <b>${tl(m.teklif)}</b> verebilirim.`]))}

function cark(){const today=new Date().toISOString().slice(0,10);const used=S.cark===today;
  const n=CARK.length,cols=["#e9b949","#6fcf86","#5fc4c9","#f0715f","#b796f0","#7aa8f0","#f2c862","#9fd88b"];
  const grad=CARK.map((c,i)=>`${cols[i]} ${i*360/n}deg ${(i+1)*360/n}deg`).join(",");
  pencere(`<h3>Günlük şans çarkı</h3><div class="sub">${used?"Bugünkü hakkını kullandın. Yarın yine gel.":"Günde bir kez çevirebilirsin."}</div>
    <div class="wheel"><div class="w" id="wh" style="background:conic-gradient(${grad})">${CARK.map((c,i)=>`<span class="lab" style="transform:rotate(${i*360/n+360/n/2-90}deg)">${c[0]}</span>`).join("")}</div><span class="pin"></span></div>
    <div class="row" style="justify-content:center"><button class="btn" data-a="kapatm">Kapat</button>${used?"":`<button class="btn gold" data-a="cevir" id="cevirBtn">Çevir</button>`}</div>`);M={t:"cark"}}
function cevir(){const today=new Date().toISOString().slice(0,10);if(S.cark===today)return;S.cark=today;
  const tot=CARK.reduce((a,c)=>a+c[1],0);let r=Math.random()*tot,i=0;for(;i<CARK.length;i++){r-=CARK[i][1];if(r<=0)break}i=Math.min(i,CARK.length-1);
  const n=CARK.length,ang=360*5+(360-(i*360/n+360/n/2));$("#wh").style.transform=`rotate(${ang}deg)`;$("#cevirBtn").disabled=true;
  setTimeout(()=>{CARK[i][2]();toast(`Çarktan çıkan: ${CARK[i][0]}`,"ev");kaydet();dirty=1;ciz()},3300)}

/* ================= Etkileşim ================= */
function odeme(c){if(S.kasa<c){toast(`Kasada yeterli para yok. Gereken ${tl(c)}.`,"bad");return false}S.kasa-=c;return true}
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b||b.disabled)return;const a=b.dataset.a,d=b.dataset,c=cur();
  switch(a){
  case"geri":geri();break;case"eve":eve();break;
  case"git":git(d.s,{il:+d.il||undefined,ii:d.ii!==undefined?+d.ii:undefined,id:d.id,sel:d.s==="harita"?BASLANGIC_IL:undefined});break;
  case"ilsec":c.p.sel=+d.il;ciz(1);requestAnimationFrame(()=>{const ch=document.querySelector(`#ilchips button[data-il="${d.il}"]`);ch&&ch.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"})});break;
  case"ilac":{const p=+d.il;if(odeme(ilAcmaBedeli(p))){S.acik.push(p);toast(`${IL[p].n} açıldı.`,"ev");ciz(1)}break}
  case"arsa":{const list=araziler(+d.il,+d.ii),ar=list.find(x=>x.id===d.id);if(!ar)break;
    if(S.arsalar.some(x=>x.id===ar.id)){const pr=S.projeler.find(p=>p.arsa===ar.id&&p.durum!=="bitti");pr?git("proje",{id:pr.id}):tasarlaAc(ar.id);break}
    const harc=Math.round(ar.fiyat*.04);
    pencere(`<h3>${ar.donum} dönüm · ${esc(ar.ilce)}</h3><div class="pic" style="border-radius:12px;overflow:hidden">${araziSVG(ar)}</div>
      <div class="sumline"><span>Arazi bedeli</span><b class="num">${tl(ar.fiyat)}</b></div><div class="sumline"><span>Tapu harcı (%4)</span><b class="num">${tl(harc)}</b></div>
      <div class="total"><span class="lbl">Toplam</span><b class="num">${tl(ar.fiyat+harc)}</b></div><div class="note">${["I","II","III","IV"][ar.cls]}. sınıf toprak · ${SU[ar.su]} · Ada ${ar.ada} / Parsel ${ar.parsel}</div>
      <div class="row"><button class="btn" data-a="kapatm">Vazgeç</button><button class="btn gold" data-a="arsaal" data-il="${d.il}" data-ii="${d.ii}" data-id="${ar.id}">Tapuyu al</button></div>`);M={t:"arsa"};break}
  case"arsaal":{const ar=araziler(+d.il,+d.ii).find(x=>x.id===d.id);const tot=ar.fiyat+Math.round(ar.fiyat*.04);if(!odeme(tot))break;
    ar.endeks0=S.endeks;S.arsalar.push(ar);pencere(null);toast(`Tapu senin: ${ar.ilce}, ${ar.donum} dönüm.`,"ev");tasarlaAc(ar.id);break}
  case"tasarla":tasarlaAc(d.id);break;
  case"dtip":{const D=c.p.D,t=TIPLER[d.k];if(t.lvl>S.ofis){toast(`${t.ad} için merkezini ${OFIS[t.lvl].ad} seviyesine taşı.`,"bad");break}D.tip=d.k;
    if(VARS[d.k]){const a=S.arsalar.find(x=>x.id===D.arsa);D.urun=Object.keys(URUN).filter(k=>URUN[k].tip===d.k).sort((x,y)=>fit(y,a.il)-fit(x,a.il))[0]}
    const P=plan(D);if(P.max)D.adet=Math.min(D.adet,P.max);ciz(1);break}
  case"dset":{const D=c.p.D;D[d.k]=d.k==="urun"?d.v:+d.v;ciz(1);break}
  case"adim2":{const D=c.p.D;const P=plan(D);if(P.err&&!(P.err.includes("kuyu"))){toast(P.err,"bad");break}D.adim=2;c.p.adim=2;ciz(1);$("#scr").scrollTop=0;break}
  case"don":{const D=c.p.D;D.don[d.k]=!D.don[d.k];ciz(1);break}
  case"kur":projeKur(c.p.D);break;
  case"hasat":{const p=S.projeler.find(x=>x.id===d.id);hasatKaldir(p);ciz(1);break}
  case"hal":{const p=S.projeler.find(x=>x.id===d.id);const f=birimFiyat(p)*(S.makine.kamyon?.9:.85);const n=sat(p,p.stok,f,"Hal");toast(`Hale verildi: +${tl(n,1)}`);ciz(1);break}
  case"pazarlik":pazarlikPenceresi.v=0;pazarlikPenceresi(d.id,d.m);break;
  case"pzkabul":{const p=S.projeler.find(x=>x.id===M.pid),m=p.musteri.find(x=>x.id===M.mid);sat(p,m.qty,m.teklif,m.ad);p.musteri=p.musteri.filter(x=>x.id!==m.id);pencere(null);ciz(1);break}
  case"pzkarsi":pazarlikKarsi();break;
  case"pzred":{const p=S.projeler.find(x=>x.id===M.pid);p.musteri=p.musteri.filter(x=>x.id!==M.mid);pencere(null);ciz(1);break}
  case"kapatm":pencere(null);ciz(1);break;
  case"yeniden":{const p=S.projeler.find(x=>x.id===d.id);if(p.D)projeKur(JSON.parse(JSON.stringify(p.D)),true);break}
  case"kirala":{const ar=S.arsalar.find(x=>x.id===d.id);const kira=Math.round(arsaDeger(ar)*.0035);
    const p={id:uid(),tip:"kira",arsa:ar.id,ad:`${ar.ilce} kiralık arazi`,il:ar.il,ilce:ar.ilce,durum:"kirada",kira,yatirim:0,log:[],musteri:[]};log(p,`${pick(KOYLU)} araziyi kiraladı. Günlük ${tl(kira)}.`);S.projeler.unshift(p);toast("Arazi kiraya verildi.");ciz(1);break}
  case"kirabit":{const p=S.projeler.find(x=>x.id===d.id);p.durum="bitti";p.bitti=now();log(p,"Kira sözleşmesi bitti.");ciz(1);break}
  case"arsasat":{const ar=S.arsalar.find(x=>x.id===d.id);const v=Math.round(arsaDeger(ar)*.95);
    pencere(`<h3>Araziyi sat</h3><div class="bubble">${IL[ar.il].n} ${esc(ar.ilce)}, ${ar.donum} dönüm. Emlakçı ${tl(v)} teklif ediyor (piyasanın %95'i).</div><div class="row"><button class="btn" data-a="kapatm">Vazgeç</button><button class="btn gold" data-a="arsasat2" data-id="${ar.id}">Sat · ${tl(v,1)}</button></div>`);M={t:"x"};break}
  case"arsasat2":{const i=S.arsalar.findIndex(x=>x.id===d.id);const v=Math.round(arsaDeger(S.arsalar[i])*.95);S.arsalar.splice(i,1);para(v);S.projeler=S.projeler.filter(p=>p.arsa!==d.id||p.durum!=="bitti");pencere(null);toast(`Arazi satıldı: +${tl(v,1)}`);ciz(1);break}
  case"teklif":{const ih=S.ihaleler.find(x=>x.id===d.id);const v=ih.teklif||Math.round(ih.bedel*.9/1000)*1000;
    pencere(`<h3>${esc(ih.ad)}</h3><div class="sub">${esc(ih.kurum)} · ${ih.sure} günlük iş</div><div class="sumline"><span>Tahmini bedel</span><b class="num">${tl(ih.bedel)}</b></div><div class="sumline"><span>Tahmini maliyet</span><b class="num">%60 – %80 arası</b></div>
      ${sl("ihv","Teklifin",v,Math.round(ih.bedel*.6/1000)*1000,Math.round(ih.bedel*1.1/1000)*1000,1000,tl(v))}<div class="note">Teminat: ${tl(ih.bedel*.03)}. Rakipler genelde bedelin %74–%102'si arasında teklif verir. Kazanırsan maliyet işe başlarken kasadan çıkar, hakediş iş bitince ödenir.</div>
      <div class="row"><button class="btn" data-a="kapatm">Vazgeç</button><button class="btn gold" data-a="teklif2" data-id="${ih.id}">Teklifi ver</button></div>`);M={t:"ih",id:ih.id};break}
  case"teklif2":{const ih=S.ihaleler.find(x=>x.id===d.id);const v=+$("#ihv").value;if(!ih.teklif){const tm=Math.round(ih.bedel*.03);if(!odeme(tm))break;ih.teminat=tm}ih.teklif=v;pencere(null);toast("Teklifin zarfa kondu.");ciz(1);break}
  case"vade":EKRAN.banka.v=+d.v;document.querySelectorAll("#vade button").forEach(x=>x.classList.toggle("on",x===b));krediHesap();break;
  case"kredial":{const P=+$("#kmik").value,n=EKRAN.banka.v||6;if(P>krediLimit())break;const tak=Math.round(P*(1+.022*n)/n);
    S.krediler.push({id:uid(),banka:"Bereket Bank",anapara:P,taksit:tak,kalan:n,sonraki:now()+10});para(P);toast(`Kredi hesabına geçti: ${tl(P)}`,"ev");ciz(1);break}
  case"kapat":{const k=S.krediler.find(x=>x.id===d.id);const v=Math.round(k.taksit*k.kalan*.97);if(odeme(v)){S.krediler=S.krediler.filter(x=>x!==k);S.not=Math.min(900,S.not+15);toast("Kredi kapatıldı.");ciz(1)}break}
  case"ise":{S.personel[d.k]=+d.v;toast(`${ROLLER[d.k].ad} işe başladı (${KALITE[+d.v-1].ad}).`);ciz(1);break}
  case"kov":{S.personel[d.k]=0;ciz(1);break}
  case"makal":if(odeme(MAKINE[d.k].c)){S.makine[d.k]=1;toast(`${MAKINE[d.k].ad} çiftliğe geldi.`);ciz(1)}break;
  case"ofisal":if(odeme(OFIS[S.ofis+1].c)){S.ofis++;toast(`Yeni merkezin: ${OFIS[S.ofis].ad}`,"ev");ciz(1)}break;
  case"yatal":{const y=YATIRIM.find(x=>x.k===d.k);if(odeme(y.c)){S.yatirim[y.k]=(S.yatirim[y.k]||0)+1;toast(`${y.ad}: pay alındı.`);ciz(1)}break}
  case"yariKabul":{const o=S.teklifler.find(x=>x.id===d.id);if(!o)break;const ar={id:"y"+o.id,il:o.il,ii:o.ii,ilce:o.ilce,donum:o.donum,cls:o.cls,su:o.su,asfalt:false,fiyat:0,ada:0,parsel:0,yari:o.pay,sahip:o.kim,seed:hsh(o.id)};
    S.arsalar.push(ar);S.teklifler=S.teklifler.filter(x=>x!==o);toast(`${o.kim} ile anlaştın. Arazi kullanımına açıldı.`,"ev");tasarlaAc(ar.id);break}
  case"yariPaz":{const o=S.teklifler.find(x=>x.id===d.id);if(!o)break;if(o.pazarlik>=2){toast(`${o.kim}: "Daha fazla inemem evladım."`);break}o.pazarlik++;
    if(Math.random()<.55){o.pay=Math.max(.25,o.pay-.05);toast(`${o.kim}: "Peki, %${Math.round(o.pay*100)} olsun."`,"ev")}else{S.teklifler=S.teklifler.filter(x=>x!==o);toast(`${o.kim} kırıldı, teklifini geri çekti.`,"bad")}ciz(1);break}
  case"yardim":pencere(`<h3>Nasıl oynanır?</h3><div class="note" style="font-size:13px;line-height:1.6">
    1. <b>Haritadan</b> bir il seç. Konya açık, diğerlerini parayla açarsın.<br>2. <b>İlçe</b> seç, arazi portföyünden tapu al. Toprak sınıfı ve su durumu verimi belirler.<br>3. <b>Proje tasarla</b>: tarla, sera, bahçe, süt, besi ya da kanatlı. Bölgenin yöresel ürünü %20 fazla verir.<br>4. Kurulum bitince hasat kaldır, <b>tüccarla pazarlık</b> yap ya da hale ver. Hayvancılık her gün gelir getirir.<br>5. <b>İhalelere</b> gir, kredi çek, personel ve makine al, merkezini büyüt.<br>Bir oyun günü yaklaşık 45 saniye. Oyun kapalıyken de en fazla ${OFFLINE_MAX} gün işler.</div><button class="btn gold" data-a="kapatm">Başla</button>`);M={t:"x"};break;
  case"cark":cark();break;case"cevir":cevir();break;
  }
  kaydet()});
document.addEventListener("input",e=>{const id=e.target.dataset.i;if(!id)return;const c=cur(),v=+e.target.value;
  if(id==="alan"||id==="adet"){c.p.D[id]=v;const P=plan(c.p.D);e.target.closest(".sl").querySelector("b").textContent=id==="alan"?v+" dönüm":v+(c.p.D.tip==="kanatli"?" bin tavuk":" baş");
    const sc=document.querySelector(".scene");if(sc)sc.innerHTML=sceneSVG(c.p.D,P);const oz=document.querySelector(".sum");if(oz)oz.outerHTML=ozet(c.p.D,P)}
  if(id==="pz"){const p=S.projeler.find(x=>x.id===M.pid),m=p.musteri.find(x=>x.id===M.mid);pazarlikPenceresi.v=v;$("#pzv").textContent=`${tl(v)} · toplam ${tl(v*m.qty,1)}`}
  if(id==="ihv")e.target.closest(".sl").querySelector("b").textContent=tl(v);
  if(id==="kmik")krediHesap()});
function krediHesap(){const k=$("#kmik");if(!k)return;const P=+k.value,n=EKRAN.banka.v||6;k.closest(".sl").querySelector("b").textContent=tl(P);$("#ktak").textContent=`${n} × ${tl(P*(1+.022*n)/n)}`}
function tasarlaAc(id){const a=S.arsalar.find(x=>x.id===id);const D=tasarimVarsayilan(a);stack.push({s:"tasarla",p:{arsa:id,D,adim:1}});dirty=1;$("#scr").scrollTop=0;ciz()}
function projeKur(D,yeniden){const a=S.arsalar.find(x=>x.id===D.arsa);
  if(aktifProje()>=OFIS[S.ofis].max){toast(`Aynı anda en fazla ${OFIS[S.ofis].max} proje. Merkezini büyüt.`,"bad");return}
  if(S.projeler.some(p=>p.arsa===a.id&&p.durum!=="bitti")){toast("Bu arazide zaten bir proje var.","bad");return}
  const P=plan(D);if(P.err){toast(P.err,"bad");return}
  let cost=P.toplam;if(yeniden&&D.tip==="besi")cost=P.yenile;if(yeniden&&(D.tip==="sera"||D.tip==="bahce"||D.tip==="sut"||D.tip==="kanatli"))cost=P.toplam;
  if(!odeme(cost))return;if(P.indirim)S.indirim=0;
  const u=P.urun?URUN[P.urun]:null;const ad=`${a.ilce} ${u?u.ad+(D.tip==="sera"?" serası":D.tip==="bahce"?" bahçesi":" tarlası"):{sut:"Süt Çiftliği",besi:"Besi Çiftliği",kanatli:"Yumurta Tesisi"}[D.tip]}`;
  const p={id:uid(),arsa:a.id,tip:D.tip,ad,il:a.il,ilce:a.ilce,durum:"kurulum",bas:now(),sure:P.gun,yatirim:cost,urun:P.urun,alan:P.alan,kg:P.kg,fm:P.fm,tekrar:P.tekrar,op:P.op,
    net:P.net,adet:P.adet,birim:P.birim,sulama:D.sulama,don:{...D.don},yari:a.yari||0,stok:0,mult:1,log:[],musteri:[],D:JSON.parse(JSON.stringify(D))};
  log(p,`Proje başladı. Yatırım ${tl(cost)}.`);S.projeler=S.projeler.filter(x=>!(x.arsa===a.id&&x.durum==="bitti"));S.projeler.unshift(p);
  toast(`${ad} kuruluyor.`,"ev");stack=[{s:"ana"},{s:"proje",p:{id:p.id}}];dirty=1;ciz()}

/* ================= Çizim ================= */
let lastSig="";
function ciz(force){const c=cur();if(!EKRAN[c.s]){stack=[{s:"ana"}]}
  $("#top").innerHTML=ust();const scr=$("#scr"),st=scr.scrollTop,ch=document.getElementById("ilchips"),cl=ch?ch.scrollLeft:0;
  scr.innerHTML=EKRAN[cur().s](cur().p||{});scr.scrollTop=st;const ch2=document.getElementById("ilchips");if(ch2)ch2.scrollLeft=cl;
  dirty=0;canli();if(cur().s==="banka")krediHesap()}
function canli(){const t=now();
  const k=tl(S.kasa);document.querySelectorAll('[data-live="kasa"],[data-live="kasa2"]').forEach(e=>{e.textContent=k;e.classList.toggle("neg",S.kasa<0)});
  const g=document.querySelector('[data-live="gun"]');if(g)g.textContent=`Gün ${Math.floor(t)+1} · ${GUNLER[Math.floor(t)%7]}`;
  const gp=document.querySelector('[data-live="gunp"]');if(gp)gp.style.width=((t%1)*100)+"%";
  document.querySelectorAll("[data-prog]").forEach(e=>{const p=S.projeler.find(x=>x.id===e.dataset.prog);if(!p)return;
    const f=p.durum==="kurulum"?(t-p.bas)/p.sure:p.tekrar?(t-p.dongu)/p.tekrar:1;e.style.width=clamp(f*100,0,100)+"%"});
  document.querySelectorAll("[data-left]").forEach(e=>{const p=S.projeler.find(x=>x.id===e.dataset.left);if(!p)return;
    const l=p.durum==="kurulum"?p.bas+p.sure-t:p.tekrar?p.dongu+p.tekrar-t:0;e.textContent=l>0?gunTxt(l)+" kaldı":"bitti"});
  document.querySelectorAll("[data-ih]").forEach(e=>{const i=S.ihaleler.find(x=>x.id===e.dataset.ih);if(i)e.textContent=gunTxt(Math.max(0,i.bitis-t))+" sonra"});
  document.querySelectorAll("[data-kr]").forEach(e=>{const k=S.krediler.find(x=>x.id===e.dataset.kr);if(k)e.textContent=gunTxt(Math.max(0,k.sonraki-t))+" sonra"})}
function dongu(){const r=Date.now();let dt=r-S.real;S.real=r;if(dt<0||dt>GUN*2)dt=Math.min(Math.max(dt,0),GUN*2);ilerle(dt);
  const sc=cur().s;if(dirty&&sc!=="tasarla"&&!(M&&M.t)&&sc!=="banka")ciz();else canli();if(M&&M.t==="pz"&&!S.projeler.find(x=>x.id===M.pid)?.musteri.find(m=>m.id===M.mid))pencere(null)}

/* ================= Başlangıç ================= */
(function(){
  const r=Date.now(),away=Math.max(0,r-S.real),k0=S.kasa;S.real=r;
  if(away>5000){ilerle(Math.min(away,OFFLINE_MAX*GUN));const fark=S.kasa-k0;if(away>GUN)toast(`Sen yokken ${gunTxt(Math.min(away,OFFLINE_MAX*GUN)/GUN)} geçti. Kasa ${fark>=0?"+":""}${tl(fark,1)}`,"ev")}
  while(S.ihaleler.filter(i=>!i.sonuc).length<4)ihaleUret();
  ciz();
  if(!S.projeler.length&&!S.arsalar.length)setTimeout(()=>document.querySelector('[data-a="yardim"]')?.click(),400);
  setInterval(dongu,250);setInterval(kaydet,5000);
  document.addEventListener("visibilitychange",()=>{if(document.hidden)kaydet()});window.addEventListener("pagehide",kaydet);
})();
</script>
