<style>
/* Layout: tek sütun, dar okuma kolonu; nar kırmızısı yalnız eylem ve puanlarda. */
:root{
  --bg:#F6F3F4; --surface:#FFFFFF; --ink:#22181D; --muted:#6E6068; --line:#E4DBDF;
  --nar:#B3284F; --nar-soft:#F6DCE4; --sage:#3F7A68; --sage-soft:#DCEDE6;
  --display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161013; --surface:#211A1E; --ink:#F3ECEF; --muted:#AFA0A8; --line:#3A2F35;
  --nar:#F0688F; --nar-soft:#43202C; --sage:#7CC4AC; --sage-soft:#1D3A31; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161013; --surface:#211A1E; --ink:#F3ECEF; --muted:#AFA0A8; --line:#3A2F35;
  --nar:#F0688F; --nar-soft:#43202C; --sage:#7CC4AC; --sage-soft:#1D3A31; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 17px/1.6 var(--body);
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.wrap{max-width:640px;margin:0 auto;padding-block:20px 56px;display:flex;flex-direction:column;gap:28px}
header.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.logo{font:800 26px/1 var(--display);letter-spacing:-.02em;color:var(--ink);text-decoration:none}
.logo span{color:var(--nar)}
.top a.lnk{color:var(--muted);font-size:15px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.02em}
h1{font-size:clamp(34px,8vw,52px);line-height:1.05;font-weight:800}
h2{font-size:clamp(24px,5vw,30px);line-height:1.15;font-weight:700}
h3{font-size:19px;font-weight:700}
p{margin:0}
.eyebrow{font:600 13px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--nar)}
.lead{font-size:19px;color:var(--muted);max-width:34em}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px}
.btn{appearance:none;border:0;cursor:pointer;font:600 17px/1 var(--body);padding:16px 22px;border-radius:999px;

.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn:focus-visible,.opt:focus-visible,input:focus-visible{outline:3px solid var(--nar);outline-offset:3px}
.btn:disabled{opacity:.45;cursor:default}
.topics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.topics div{background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:4px}
.topics b{font:700 17px var(--display)}
.topics small{color:var(--muted);font-size:14px;line-height:1.45}
.band{background:var(--sage-soft);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:10px}
.band h2{color:var(--ink)}
.band .tag{font-size:13px;font-weight:600;color:var(--sage);letter-spacing:.08em;text-transform:uppercase}
.note{font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:6px}
/* anket */
.prog{height:6px;background:var(--line);border-radius:9px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--nar);transition:width .25s}
.qmeta{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.q{font:700 clamp(22px,5vw,28px)/1.25 var(--display);text-wrap:balance;min-height:3.8em}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{appearance:none;text-align:left;font:500 17px var(--body);color:var(--ink);background:var(--surface);
  border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;display:flex;gap:12px;align-items:center}
.opt .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none}
.opt.on{border-color:var(--nar);background:var(--nar-soft)}
.opt.on .dot{border-color:var(--nar);background:var(--nar);box-shadow:inset 0 0 0 3px var(--nar-soft)}

/* sonuç */
.persona{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;display:flex;flex-direction:column;gap:10px}
.persona h2{font-size:clamp(30px,7vw,40px);color:var(--nar)}
.bars{display:flex;flex-direction:column;gap:14px}
.bar{display:grid;grid-template-columns:8.5em 1fr 3em;gap:12px;align-items:center;font-size:15px}
.bar .t{height:10px;background:var(--line);border-radius:9px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--sage);border-radius:9px}
.bar.n .t i{background:var(--nar)}
.bar em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.bar .lbl{min-width:0}
.bar .lbl small{display:block;color:var(--muted);font-size:13px;line-height:1.3}
.code{font:700 clamp(20px,5.5vw,26px)/1.2 ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;letter-spacing:.04em;

label{font-weight:600;font-size:15px}
input[type=text]{width:100%;font:500 18px var(--body);color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:14px}
input.mono{font-family:ui-monospace,Menlo,Consolas,monospace;text-transform:uppercase;letter-spacing:.04em}
.err{color:var(--nar);font-size:14px;min-height:1.4em}
.score{display:flex;align-items:baseline;gap:10px}
.score b{font:800 clamp(64px,18vw,96px)/1 var(--display);color:var(--nar);font-variant-numeric:tabular-nums;letter-spacing:-.04em}
.score span{color:var(--muted)}
.diffs{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.diffs li{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.diffs .ans{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--muted)}
.diffs .ans b{color:var(--ink);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 18px;border-radius:999px;font-size:15px}
footer{font-size:13px;color:var(--muted);text-align:center}
@media (max-width:480px){.topics{grid-template-columns:minmax(0,1fr)}.bar{grid-template-columns:7em 1fr 2.6em}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.tests{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.test{appearance:none;text-align:left;cursor:pointer;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:6px}
.test b{font:700 22px/1.1 var(--display)}
.test small{color:var(--muted);font-size:15px;line-height:1.45}
.test .tm{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--nar)}
.test.ana{border-color:var(--nar);background:var(--nar-soft)}
.test:focus-visible{outline:3px solid var(--nar);outline-offset:3px}
@media (hover:hover){.test:hover{border-color:var(--nar)}}
@media (max-width:480px){.tests{grid-template-columns:minmax(0,1fr)}}
nav.nav{display:flex;gap:4px 14px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
nav.nav a{color:var(--muted);font-size:15px;text-decoration:none;font-weight:500}
nav.nav a.on{color:var(--ink);text-decoration:underline;text-underline-offset:4px}
nav.nav a.cta{color:var(--nar);font-weight:600}
.demo{background:var(--nar-soft);color:var(--ink);font-size:14px;border-radius:10px;padding:10px 14px}
.btn.google{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line);justify-content:center;width:100%}
.ayrac{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:14px}
.ayrac::before,.ayrac::after{content:"";flex:1;height:1px;background:var(--line)}
.seg{display:flex;background:var(--line);border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;appearance:none;border:0;background:transparent;font:600 15px var(--body);color:var(--muted);padding:10px;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink)}
textarea,select{width:100%;font:500 17px var(--body);color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:14px}
textarea{min-height:110px;resize:vertical;line-height:1.5}
input[type=email],input[type=password],input[type=number]{width:100%;font:500 18px var(--body);color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:14px}
textarea:focus-visible,select:focus-visible{outline:3px solid var(--nar);outline-offset:3px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld small{color:var(--muted);font-size:13px}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:500}
.chk input{width:20px;height:20px;margin-top:3px;accent-color:var(--nar)}
.cards{display:flex;flex-direction:column;gap:12px}
.card{appearance:none;text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;align-items:center;cursor:pointer}
@media (hover:hover){.card:hover{border-color:var(--nar)}}
.card:focus-visible{outline:3px solid var(--nar);outline-offset:3px}
.card b{font:700 20px var(--display)}
.card .meta{color:var(--muted);font-size:14px}
.card .pct{grid-row:span 3;font:800 30px var(--display);color:var(--nar);font-variant-numeric:tabular-nums;text-align:right}
.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--line);color:var(--ink);width:max-content}
.pill.ok{background:var(--sage-soft);color:var(--sage)}
.pill.nar{background:var(--nar-soft);color:var(--nar)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.contact{background:var(--sage-soft);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:6px}
.contact b{font:600 18px var(--body);user-select:all;word-break:break-word}
.danger{color:var(--nar)}
@media (max-width:480px){.grid2{grid-template-columns:minmax(0,1fr)}.seg button{font-size:14px;padding:10px 4px;white-space:nowrap}}
.sahne{--sahne:#0E0A0C;position:relative;background:var(--sahne);border-radius:var(--r);overflow:hidden;aspect-ratio:3/4;max-height:68vh;max-width:100%;width:100%;margin:0 auto}
.sahne video{display:block}
#v-karsi{width:100%;height:100%;object-fit:cover}
#v-ben{position:absolute;right:12px;bottom:12px;width:30%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;border:2px solid rgba(255,255,255,.7);transform:scaleX(-1);background:var(--sahne)}
.v-durum{position:absolute;left:16px;right:16px;top:16px;margin:0;color:#fff;font-size:16px;line-height:1.45;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.v-durum:empty{display:none}
.kontrol{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.yuvar{appearance:none;border:0;cursor:pointer;font:600 15px var(--body);padding:14px 18px;border-radius:999px;background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.yuvar[aria-pressed="false"]{background:var(--ink);color:var(--bg)}
.yuvar.kapat{background:var(--nar);color:var(--surface);box-shadow:none}
.yuvar:focus-visible{outline:3px solid var(--nar);outline-offset:3px}
.cagri{position:fixed;z-index:20;top:calc(12px + env(safe-area-inset-top, 0px));left:max(16px, env(safe-area-inset-left, 0px));right:max(16px, env(safe-area-inset-right, 0px));max-width:520px;margin:0 auto;background:var(--surface);border:1.5px solid var(--nar);border-radius:var(--r);padding:16px 18px;box-shadow:0 10px 30px rgba(0,0,0,.18);display:flex;flex-direction:column;gap:12px}
.cagri p{margin:0}
.rozet{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--nar);color:var(--surface);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
nav.nav .rozet{margin-left:4px;vertical-align:1px}
.card .onizleme{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.card .rozet{justify-self:end}
.sohbet-bas{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}

.akis{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;height:min(58vh,520px);overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.akis .bos{margin:auto;color:var(--muted);text-align:center}
.balon{max-width:80%;padding:10px 14px;border-radius:16px;display:flex;flex-direction:column;gap:2px}
.balon p{white-space:pre-wrap;word-break:break-word;line-height:1.45}
.balon time{font-size:11px;color:var(--muted);align-self:flex-end;font-variant-numeric:tabular-nums}
.balon.ben{align-self:flex-end;background:var(--nar-soft);border-bottom-right-radius:4px}
.balon.o{align-self:flex-start;background:var(--bg);border-bottom-left-radius:4px}

.yaz textarea{min-height:52px;max-height:140px;resize:none;flex:1;min-width:0;padding:13px 14px}
.avatar{--b:56px;width:var(--b);height:var(--b);border-radius:50%;overflow:hidden;flex:none;display:inline-flex;align-items:center;justify-content:center;background:var(--nar-soft);color:var(--nar);font:700 calc(var(--b)*.42)/1 var(--display)}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}

.card.kisi{grid-template-columns:auto minmax(0,1fr) auto;gap:14px}
.card.kisi .ic{display:flex;flex-direction:column;gap:4px;min-width:0}
.card.kisi .pct{grid-row:auto}
.aday-bas{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.filtre{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.filtre summary{cursor:pointer;font-weight:600;display:flex;align-items:center;gap:8px}
.satir{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 10px 10px 16px}
.sikayet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.sikayet .meta,.meta{color:var(--muted);font-size:14px}
.yasal h3{margin-top:10px}
.yasal ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.yasal a,.chk a,footer a{color:inherit;text-decoration:underline;text-underline-offset:3px}
.dog-kutu{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.adim{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.kod-k{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.1em;color:var(--nar)}
.karsilastir{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.karsilastir figure{margin:0;display:flex;flex-direction:column;gap:6px}
.karsilastir img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;background:var(--line)}
.karsilastir figcaption{font-size:13px;color:var(--muted)}
.gizli{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>

function supabaseApi(){
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {auth:{flowType:"pkce"}});
  let uid = null;
  const ok = ({data,error}) => { if(error) throw error; return data; };
  const PROFIL_ALAN = "id,ad,dogum_yili,cinsiyet,sehir,hakkinda,cevap,gorunur,foto,askida,riza_tarihi,dogrulandi,telefon_dogrulandi,eposta_bildirim";
  return {
    demo:false,
    async oturum(){ const u=(await sb.auth.getSession()).data.session?.user||null; uid=u?.id||null; return u; },
    async kayit(email,sifre){ const d=ok(await sb.auth.signUp({email,password:sifre})); uid=d.session?.user.id||null; return !!d.session; },
    async giris(email,sifre){ const d=ok(await sb.auth.signInWithPassword({email,password:sifre})); uid=d.user.id; },
    // Google ile giriş: Google sayfasına gider, giriş sonrası bu sayfaya ?code= ile döner; supabase-js oturumu kendisi açar.
    async google(){ ok(await sb.auth.signInWithOAuth({provider:"google",options:{redirectTo:location.origin+location.pathname,queryParams:{prompt:"select_account"}}})); },
    async cikis(){ await sb.auth.signOut(); uid=null; },
    async profilim(){ return ok(await sb.from("profiles").select(PROFIL_ALAN).eq("id",uid).maybeSingle()); },
    async profilKaydet(p,iletisim){
      ok(await sb.from("profiles").upsert({...p,id:uid,guncelleme:new Date().toISOString()}));
      if(iletisim!==undefined) ok(await sb.from("iletisim").upsert({id:uid,bilgi:iletisim}));
    },
    async hesapSil(){
      await sb.storage.from("foto").remove(["net/"+uid+".jpg","bulanik/"+uid+".jpg"]).catch(()=>{});
      ok(await sb.rpc("hesabimi_sil")); await sb.auth.signOut(); uid=null;
    },
    async engelle(id,ad){ ok(await sb.from("engel").upsert({from_id:uid,to_id:id,ad})); await sb.from("ilgi").delete().eq("from_id",uid).eq("to_id",id); },
    async engelKaldir(id){ ok(await sb.from("engel").delete().eq("from_id",uid).eq("to_id",id)); },
    async engellerim(){ return ok(await sb.from("engel").select("to_id,ad").eq("from_id",uid).order("olusturma",{ascending:false})); },
    async sikayetEt(id,sebep,aciklama){ ok(await sb.from("sikayet").insert({from_id:uid,hakkinda_id:id,sebep,aciklama:aciklama||null})); },
    async yoneticiMi(){ return !!ok(await sb.from("yoneticiler").select("id").eq("id",uid).maybeSingle()); },
    async goruldu(){ ok(await sb.from("profiles").update({son_gorulme:new Date().toISOString()}).eq("id",uid)); },
    async dogrulamam(){ return ok(await sb.from("dogrulama").select("durum,red_sebep,kod").eq("id",uid).maybeSingle()); },
    async dogrulamaGonder(kod,net){
      ok(await sb.storage.from("foto").upload("dogrulama/"+uid+".jpg",await dataBlob(net),{upsert:true,contentType:"image/jpeg"}));
      ok(await sb.from("dogrulama").upsert({id:uid,kod,durum:"bekliyor",red_sebep:null,olusturma:new Date().toISOString()}));
    },
    async dogrulamalar(){
      const l=ok(await sb.from("dogrulama").select("id,kod,durum,red_sebep,olusturma").order("olusturma").limit(200));
      const pr=l.length?ok(await sb.from("profiles").select(PROFIL_ALAN).in("id",l.map(d=>d.id))):[];
      const m=Object.fromEntries(pr.map(x=>[x.id,x])); return l.map(d=>({...d,profil:m[d.id]}));
    },
    async dogrulamaFotolari(ids){
      if(!ids.length) return {};
      const d=ok(await sb.storage.from("foto").createSignedUrls(ids.map(i=>"dogrulama/"+i+".jpg"),600));
      const m={}; d.forEach((r,i)=>{ if(r.signedUrl) m[ids[i]]=r.signedUrl; }); return m;
    },
    async dogrulamaKarar(id,durum,red_sebep){ ok(await sb.from("dogrulama").update({durum,red_sebep}).eq("id",id)); },
    async telefonKodGonder(tel){ ok(await sb.auth.updateUser({phone:tel})); },
    async telefonDogrula(tel,kod){ ok(await sb.auth.verifyOtp({phone:tel,token:kod,type:"phone_change"})); },
    async sikayetler(){
      const l=ok(await sb.from("sikayet").select("id,from_id,hakkinda_id,sebep,aciklama,durum,olusturma").order("olusturma",{ascending:false}).limit(300));
      const ids=[...new Set(l.flatMap(r=>[r.from_id,r.hakkinda_id]).filter(Boolean))];
      const pr=ids.length?ok(await sb.from("profiles").select(PROFIL_ALAN).in("id",ids)):[];
      const m=Object.fromEntries(pr.map(x=>[x.id,x]));
      return l.map(r=>({...r,hakkinda:m[r.hakkinda_id],sikayetci:m[r.from_id]}));
    },
    async sikayetDurum(id,durum){ ok(await sb.from("sikayet").update({durum}).eq("id",id)); },
    async askiya(id,v){ ok(await sb.from("profiles").update({askida:v}).eq("id",id)); },
    async fotoYukle(net,bulanik){
      const yukle=async(klasor,d)=>ok(await sb.storage.from("foto").upload(klasor+"/"+uid+".jpg",await dataBlob(d),{upsert:true,contentType:"image/jpeg",cacheControl:"60"}));
      await yukle("net",net); await yukle("bulanik",bulanik);
      const surum=(S.profil?.foto||0)+1; ok(await sb.from("profiles").update({foto:surum}).eq("id",uid)); return surum;
    },
    async fotoSil(){ await sb.storage.from("foto").remove(["net/"+uid+".jpg","bulanik/"+uid+".jpg"]); ok(await sb.from("profiles").update({foto:0}).eq("id",uid)); },
    async fotolar(liste){
      if(!liste.length) return {};
      const yol=x=>(x.net?"net/":"bulanik/")+x.id+".jpg";
      const d=ok(await sb.storage.from("foto").createSignedUrls(liste.map(yol),3600));
      const m={}; d.forEach((r,i)=>{ if(r.signedUrl) m[liste[i].id]=r.signedUrl+"&v="+liste[i].surum; }); return m;
    },
    async iletisimim(){ return ok(await sb.from("iletisim").select("bilgi").eq("id",uid).maybeSingle())?.bilgi||""; },
    async adaylar(){ return ok(await sb.from("profiles").select(PROFIL_ALAN).neq("id",uid).eq("gorunur",true).limit(500)); },
    async kisi(id){ return ok(await sb.from("profiles").select(PROFIL_ALAN).eq("id",id).maybeSingle()); },
    async ilgiler(){
      const d=ok(await sb.from("ilgi").select("from_id,to_id"));
      return { giden:new Set(d.filter(r=>r.from_id===uid).map(r=>r.to_id)), gelen:new Set(d.filter(r=>r.to_id===uid).map(r=>r.from_id)) };
    },
    async ilgiGonder(id){ ok(await sb.from("ilgi").insert({from_id:uid,to_id:id})); },
    async ilgiGeriAl(id){ ok(await sb.from("ilgi").delete().eq("from_id",uid).eq("to_id",id)); },
    async iletisimGetir(id){ return ok(await sb.from("iletisim").select("bilgi").eq("id",id).maybeSingle())?.bilgi||null; },
    // Görüntülü görüşme: arama kayıtları (cagri tablosu) ve iki kişilik özel sinyal kanalı
    cagriDinle(cb){
      const ch=sb.channel("cagri-"+uid)
        .on("postgres_changes",{event:"*",schema:"public",table:"cagri",filter:"to_id=eq."+uid},e=>cb(e.eventType,e.new))
        .on("postgres_changes",{event:"UPDATE",schema:"public",table:"cagri",filter:"from_id=eq."+uid},e=>cb(e.eventType,e.new))
        .subscribe();
      return ()=>sb.removeChannel(ch);
    },
    async cagriBaslat(to){ return ok(await sb.from("cagri").insert({from_id:uid,to_id:to}).select("id").single()); },
    async cagriDurum(id,durum){ ok(await sb.from("cagri").update({durum}).eq("id",id)); },
    async oda(topic,onMsg){
      const ch=sb.channel(topic,{config:{private:true,broadcast:{self:false}}});
      ch.on("broadcast",{event:"m"},({payload})=>onMsg(payload));
      await new Promise((res,rej)=>ch.subscribe(st=>{ if(st==="SUBSCRIBED") res(); else if(st==="CHANNEL_ERROR"||st==="TIMED_OUT") rej(new Error("Görüşme kanalına bağlanılamadı.")); }));
      return { gonder:m=>ch.send({type:"broadcast",event:"m",payload:m}), kapat:()=>sb.removeChannel(ch) };
    },
    // Mesajlaşma
    async sohbetler(){ return ok(await sb.from("mesaj").select("id,from_id,to_id,metin,okundu,olusturma").order("olusturma",{ascending:false}).limit(1000)); },
    async mesajlar(id){
      const d=ok(await sb.from("mesaj").select("id,from_id,to_id,metin,okundu,olusturma")
        .or(`and(from_id.eq.${uid},to_id.eq.${id}),and(from_id.eq.${id},to_id.eq.${uid})`).order("olusturma",{ascending:false}).limit(200));
      return d.reverse();
    },
    async mesajGonder(to,metin){ return ok(await sb.from("mesaj").insert({from_id:uid,to_id:to,metin}).select("id,from_id,to_id,metin,okundu,olusturma").single()); },
    async okundu(id){ ok(await sb.from("mesaj").update({okundu:true}).eq("from_id",id).eq("to_id",uid).eq("okundu",false)); },
    mesajDinle(cb){
      const ch=sb.channel("mesaj-"+uid).on("postgres_changes",{event:"INSERT",schema:"public",table:"mesaj",filter:"to_id=eq."+uid},e=>cb(e.new)).subscribe();
      return ()=>sb.removeChannel(ch);
    }
  };
}

function hataMetni(e){
  if(e?.tr) return e.message;
  const m=String(e?.message||e);
  if(/Invalid login/i.test(m)) return "E-posta ya da şifre hatalı.";
  if(/already registered/i.test(m)) return "Bu e-posta ile zaten bir hesap var. Giriş yapın.";
  if(/Password should be/i.test(m)) return "Şifre en az 6 karakter olmalı.";
  if(/provider is not enabled/i.test(m)) return "Google ile giriş henüz açılmadı. Site yöneticisinin Supabase panelinde Google sağlayıcısını etkinleştirmesi gerekiyor.";
  if(/row-level security|violates/i.test(m)) return "Bu işlem için izniniz yok. Sayfayı yenileyip tekrar deneyin.";
  if(/phone provider|sms provider|Unsupported phone/i.test(m)) return "SMS doğrulaması henüz açılmadı. Site yöneticisinin Supabase panelinde bir SMS sağlayıcısı tanımlaması gerekiyor.";
  if(/Token has expired|invalid.*otp|otp.*invalid/i.test(m)) return "Kod hatalı ya da süresi dolmuş. Yeni kod isteyin.";
  if(/Email not confirmed/i.test(m)) return "E-postanızı doğrulamadınız. Gelen kutunuzdaki bağlantıya tıklayın.";
  if(/fetch|network/i.test(m)) return "Sunucuya ulaşılamadı. İnternet bağlantınızı kontrol edip tekrar deneyin.";
  return "Bir sorun oluştu: "+m;
}

// Kod: her cevap 0-5 (0 = sorulmadı). İkişer cevap bir base-36 karakter olur.
function kodla(c){
  let s=""; for(let i=0;i<c.length;i+=2) s+=(c[i]*6+(c[i+1]||0)).toString(36).toUpperCase();
  return "DENK-"+s.match(/.{1,4}/g).join("-");
}
function coz(k){
  const d=String(k).toUpperCase().replace(/^\s*DENK/,"").replace(/[^0-9A-Z]/g,"");
  if(d.length!==Q.length/2) return null;
  const c=[]; for(const ch of d){ const n=parseInt(ch,36); c.push(Math.floor(n/6), n%6); }
  return gecerli(c);
}

const konuSorulari = k => Q.map((q,i)=>q[0]===k?i:-1).filter(i=>i>=0);
function profil(c){
  const p={};
  for(const k in DIMS){
    const idx=konuSorulari(k).filter(i=>c[i]);
    if(idx.length) p[k]=Math.round(idx.reduce((s,i)=>s+((Q[i][2]?6-c[i]:c[i])-1),0)/(idx.length*4)*100);
  }
  return p;
}
function personaSec(p){
  const v=Object.values(p), en=Object.keys(p).reduce((a,b)=>p[a]>=p[b]?a:b);
  return (Math.max(...v)-Math.min(...v)<15) ? PERSONA.denge : PERSONA[en];
}
function uyum(a,b){
  const d={}; let top=0, n=0, ortak=0;
  for(const k in DIMS){
    const idx=konuSorulari(k).filter(i=>a[i]&&b[i]);
    if(!idx.length) continue;
    ortak+=idx.length;
    d[k]=Math.round(idx.reduce((s,i)=>s+(1-Math.abs(a[i]-b[i])/4),0)/idx.length*100);
    top+=d[k]; n++;
  }
  const farklar=Q.map((q,i)=>({i,f:a[i]&&b[i]?Math.abs(a[i]-b[i]):0})).filter(x=>x.f>=2).sort((x,y)=>y.f-x.f).slice(0,6);
  return {genel:n?Math.round(top/n):0, d, farklar, ortak};
}

/* ---------- fotoğraf yardımcıları ---------- */
async function fotoHazirla(file){
  if(!/^image\//.test(file.type)) throw Object.assign(new Error("Lütfen bir fotoğraf dosyası seçin."),{tr:true});
  if(file.size>15*1024*1024) throw Object.assign(new Error("Fotoğraf 15 MB'tan küçük olmalı."),{tr:true});
  const img=await createImageBitmap(file);
  const ciz=(maks,kalite)=>{
    const o=Math.min(1,maks/Math.max(img.width,img.height)), c=document.createElement("canvas");
    c.width=Math.round(img.width*o); c.height=Math.round(img.height*o);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    return c.toDataURL("image/jpeg",kalite);
  };
  return { net: ciz(api.demo?520:900, .82), bulanik: ciz(24, .7) };
}
const dataBlob = d => fetch(d).then(r=>r.blob());
function avatar(a, url, bulanik, boyut=56){
  return `<span class="avatar ${bulanik&&url?"bulanik":""}" style="--b:${boyut}px">${url?`<img src="${esc(url)}" alt="" loading="lazy">`:`<span>${esc((a.ad||"?")[0].toLocaleUpperCase("tr"))}</span>`}</span>`;
}

// Görüntü ve ses WebRTC ile iki cihaz arasında doğrudan akar; Supabase yalnızca arama bildirimini ve bağlantı bilgisini taşır.
const ICE = [{urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun1.l.google.com:19302"}, ...(TURN_SUNUCU?[TURN_SUNUCU]:[])];
let G = null;        // aktif görüşme
let cagriDur = null; // arama dinleyicisini kapatan fonksiyon
let gelen = null;    // ekrandaki gelen arama

function gorusmeBaslat(karsiId, ad, rol, cagriId){
  S.gorusme = {karsiId, ad, rol, cagriId};
  if(location.hash==="#gorusme") render(); else location.hash = "gorusme";
}

function cagriDinlemeyiBaslat(){
  if(api.demo || cagriDur || !S.user) return;
  cagriDur = api.cagriDinle(async (olay, r) => {
    const yeni = Date.now() - new Date(r.olusturma).getTime() < 60000;
    if(olay==="INSERT" && r.to_id===S.user.id && r.durum==="caliyor" && yeni){
      if(G){ api.cagriDurum(r.id,"mesgul").catch(()=>{}); return; }
      let ad="Bir eşleşmeniz";
      try{ ad=(await api.kisi(r.from_id))?.ad || ad; }catch(e){}
      gelenGoster(r, ad);
    }
    if(olay==="UPDATE"){
      if(r.to_id===S.user.id && gelen?.id===r.id && r.durum!=="caliyor") gelenGizle();
      if(r.from_id===S.user.id && G?.cagriId===r.id){
        if(r.durum==="red") gorusmeBitir("Arama reddedildi.");
        else if(r.durum==="mesgul") gorusmeBitir("Karşı taraf şu an başka bir görüşmede.");
        else if(r.durum==="kabul") durumYaz("Bağlanıyor…");
      }
    }
  });
}
function cagriDinlemeyiDurdur(){ if(cagriDur){ cagriDur(); cagriDur=null; } }

function gelenGoster(r, ad){
  gelen = r;
  const el=$("#cagri");
  el.innerHTML=`<p><b>${esc(ad)}</b> sizi görüntülü arıyor.</p>
    <div class="row"><button class="btn" id="c-kabul">Kabul et</button><button class="btn ghost" id="c-red">Reddet</button></div>`;
  el.hidden=false;
  $("#c-kabul").onclick=()=>{ gelenGizle(); gorusmeBaslat(r.from_id, ad, "cevaplayan", r.id); };
  $("#c-red").onclick=()=>{ api.cagriDurum(r.id,"red").catch(()=>{}); gelenGizle(); };
  clearTimeout(gelenGoster.t); gelenGoster.t=setTimeout(gelenGizle, 45000);
}
function gelenGizle(){ gelen=null; $("#cagri").hidden=true; }

const durumYaz = t => { const el=$("#v-durum"); if(el) el.textContent=t; };

async function gorusmeSayfa(){
  const g=S.gorusme;
  if(!S.user||!g){ location.hash=S.user?"eslesmeler":"giris"; return; }
  gorusmeKapat();
  app.innerHTML=`<div class="stack" style="gap:16px">
    <div class="stack" style="gap:6px"><p class="eyebrow">Görüntülü görüşme</p><h2>${esc(g.ad)}</h2></div>
    <div class="sahne">
      <video id="v-karsi" autoplay playsinline></video>
      <video id="v-ben" autoplay playsinline muted></video>
      <p class="v-durum" id="v-durum">Kamera açılıyor…</p>
    </div>
    <div class="kontrol">
      <button class="yuvar" id="v-mik" aria-pressed="true">Mikrofon açık</button>
      <button class="yuvar" id="v-kam" aria-pressed="true">Kamera açık</button>
      <button class="yuvar kapat" id="v-kapat">Görüşmeyi bitir</button>
    </div>
    <p style="color:var(--muted);font-size:14px">Görüşme kaydedilmez. Görüntü ve ses doğrudan iki cihaz arasında akar. Rahatsız edici bir davranışla karşılaşırsanız görüşmeyi bitirip ilgiyi geri alabilirsiniz.</p>
  </div>`;
  $("#v-kapat").onclick=()=>{ gorusmeBitir("Görüşmeyi bitirdiniz."); };
  G = {cagriId:g.cagriId, rol:g.rol, kuyruk:[]};
  const benimG = G;
  try{
    G.yerel = await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:720}},audio:{echoCancellation:true,noiseSuppression:true}});
  }catch(e){
    G=null; durumYaz("Kameraya ya da mikrofona erişilemedi. Tarayıcı ayarlarından bu siteye kamera ve mikrofon izni verip tekrar deneyin."); return;
  }
  if(G!==benimG){ benimG.yerel.getTracks().forEach(t=>t.stop()); return; } // bu arada sayfadan çıkıldı
  $("#v-ben").srcObject=G.yerel;
  const izle=(id,tur,acik,kapali)=>{ const b=$(id); b.onclick=()=>{ const tr=G?.yerel?.getTracks().filter(t=>t.kind===tur)||[]; const on=!tr[0]?.enabled; tr.forEach(t=>t.enabled=on); b.setAttribute("aria-pressed",on); b.textContent=on?acik:kapali; }; };
  izle("#v-mik","audio","Mikrofon açık","Mikrofon kapalı");
  izle("#v-kam","video","Kamera açık","Kamera kapalı");

  if(api.demo){ durumYaz("Demo modunda örnek profiller aramayı yanıtlamaz. Kameranızı ve mikrofonunuzu burada deneyebilirsiniz. Gerçek görüşmeler canlı modda çalışır."); return; }

  const pc = G.pc = new RTCPeerConnection({iceServers:ICE});
  G.yerel.getTracks().forEach(t=>pc.addTrack(t,G.yerel));
  pc.ontrack = e => { $("#v-karsi").srcObject=e.streams[0]; };
  pc.onicecandidate = e => { if(e.candidate) G?.oda?.gonder({t:"ice",c:e.candidate.toJSON()}); };
  pc.onconnectionstatechange = () => {
    const s=pc.connectionState;
    if(s==="connected"){ clearTimeout(G?.zaman); durumYaz(""); }
    if(s==="disconnected") durumYaz("Bağlantı zayıf, yeniden bağlanılıyor…");
    if(s==="failed") gorusmeBitir("Bağlantı kurulamadı. İki taraftan biri kısıtlı bir ağda olabilir; başka bir ağdan tekrar deneyin.");
  };
  const uzakEkle = async () => { for(const c of G.kuyruk.splice(0)) await pc.addIceCandidate(c).catch(()=>{}); };
  const mesaj = async m => {
    if(!G||G.pc!==pc) return;
    try{
      if(m.t==="hazir" && G.rol==="arayan"){
        durumYaz("Bağlanıyor…");
        await pc.setLocalDescription(await pc.createOffer());
        G.oda.gonder({t:"offer",sdp:pc.localDescription.toJSON()});
      } else if(m.t==="offer"){
        await pc.setRemoteDescription(m.sdp); await uzakEkle();
        await pc.setLocalDescription(await pc.createAnswer());
        G.oda.gonder({t:"answer",sdp:pc.localDescription.toJSON()});
      } else if(m.t==="answer"){
        await pc.setRemoteDescription(m.sdp); await uzakEkle();
      } else if(m.t==="ice"){
        if(pc.remoteDescription) await pc.addIceCandidate(m.c).catch(()=>{}); else G.kuyruk.push(m.c);
      } else if(m.t==="bye"){
        gorusmeBitir(`${g.ad} görüşmeyi bitirdi.`);
      }
    }catch(e){ gorusmeBitir("Bağlantı kurulurken bir sorun oluştu. Tekrar deneyin."); }
  };
  try{
    G.oda = await api.oda("gorusme:"+[S.user.id,g.karsiId].sort().join("_"), mesaj);
    if(G?.pc!==pc){ return; }
    if(G.rol==="arayan"){
      G.cagriId = (await api.cagriBaslat(g.karsiId)).id;
      durumYaz(`${g.ad} aranıyor…`);
      G.zaman = setTimeout(()=>{ if(G?.pc===pc && pc.connectionState!=="connected"){ api.cagriDurum(G.cagriId,"iptal").catch(()=>{}); gorusmeBitir(`${g.ad} cevap vermedi. Daha sonra tekrar deneyin.`); } }, 45000);
    } else {
      await api.cagriDurum(G.cagriId,"kabul");
      durumYaz("Bağlanıyor…");
      G.oda.gonder({t:"hazir"});
    }
  }catch(e){ gorusmeBitir(hataMetni(e)); }
}

function gorusmeKapat(){
  if(!G) return;
  const g=G; G=null;
  clearTimeout(g.zaman);
  try{ g.oda?.gonder({t:"bye"}); }catch(e){}
  if(g.rol==="arayan" && g.cagriId && g.pc?.connectionState!=="connected") api.cagriDurum(g.cagriId,"iptal").catch(()=>{});
  setTimeout(()=>g.oda?.kapat(), 300);
  g.pc?.close();
  g.yerel?.getTracks().forEach(t=>t.stop());
}
function gorusmeBitir(mesajMetni){
  gorusmeKapat();
  if(location.hash!=="#gorusme") return toast(mesajMetni);
  const id=S.gorusme?.karsiId;
  app.innerHTML=`<div class="stack" style="gap:18px"><p class="eyebrow">Görüntülü görüşme</p><h2>Görüşme sona erdi</h2><p class="lead">${esc(mesajMetni)}</p>
    <div class="row">${id?`<button class="btn" id="v-tekrar">Tekrar ara</button>`:""}<a class="btn ghost" href="#eslesmeler">Eşleşmelere dön</a></div></div>`;
  const t=$("#v-tekrar"); if(t) t.onclick=()=>{ S.gorusme={...S.gorusme, rol:"arayan", cagriId:null}; gorusmeSayfa(); };
}

  const s=$("#d-selfie"); if(s) s.onchange=async()=>{
    const f=s.files[0]; if(!f) return;
    if(!p.foto) return toast("Önce bir profil fotoğrafı ekleyin.");
    toast("Selfie yükleniyor…");
    try{ const h=await fotoHazirla(f); await api.dogrulamaGonder(S.dogKod, h.net); S.dogKod=null; toast("Başvurunuz alındı"); profilSayfa(); }
    catch(e){ toast(hataMetni(e)); }
  };
  const ft=$("#ft"); if(ft) ft.onsubmit=async e=>{
    e.preventDefault();
    const err=$("#t-err"), b=$("#t-btn"), no=telNormal($("#t-no").value);
    if(!no) return err.textContent="Telefon numarasını 05xx xxx xx xx biçiminde yazın.";
    err.textContent=""; b.disabled=true;
    try{
      if($("#t-kod-alan").hidden){
        await api.telefonKodGonder(no);
        $("#t-kod-alan").hidden=false; $("#t-no").readOnly=true; b.textContent="Doğrula"; $("#t-kod").focus(); toast("Kod gönderildi");
      } else {
        const kod=$("#t-kod").value.trim(); if(!/^\d{6}$/.test(kod)){ b.disabled=false; return err.textContent="6 haneli kodu yazın."; }
        await api.telefonDogrula(no,kod);
        S.profil = await api.profilim() || S.profil;
        if(api.demo) S.profil.telefon_dogrulandi=true;
        toast("Telefonunuz doğrulandı"); profilSayfa(); return;
      }
    }catch(ex){ err.textContent=hataMetni(ex); }
    b.disabled=false;
  };
}

async function dogrulamaYonetim(sayilar){
  let liste; try{ liste=await api.dogrulamalar(); }catch(e){ app.innerHTML=`<p class="err">${esc(hataMetni(e))}</p>`; return; }
  const bekleyen=liste.filter(d=>d.durum==="bekliyor");
  let selfie={}, foto={};
  try{ [selfie,foto]=await Promise.all([api.dogrulamaFotolari(bekleyen.map(d=>d.id)), api.fotolar(bekleyen.filter(d=>d.profil?.foto).map(d=>({id:d.id,net:true,surum:d.profil.foto})))]); }catch(e){}
  app.innerHTML=`<div class="stack" style="gap:20px">
    <div class="stack" style="gap:8px"><p class="eyebrow">Yönetim</p><h2>Doğrulama başvuruları</h2>
      <p style="color:var(--muted);font-size:14px">Selfiedeki kişinin profil fotoğrafıyla aynı olduğunu ve kağıttaki kodun başvurudaki kodla eşleştiğini kontrol edin.</p></div>
    ${yonetimSekmeler("dogrulama",sayilar)}
    ${bekleyen.length?`<div class="cards">${bekleyen.map(d=>{ const h=d.profil||{ad:"Silinmiş hesap"}; return `
      <article class="sikayet">
        <div class="stack" style="gap:2px"><b style="font:700 19px var(--display)">${esc(h.ad)}${h.dogum_yili?`, ${yas(h.dogum_yili)}`:""}</b><span class="meta">${esc(h.sehir||"")} · ${saat(d.olusturma)}</span></div>
        <div class="karsilastir">
          <figure>${selfie[d.id]?`<img src="${esc(selfie[d.id])}" alt="Doğrulama selfiesi">`:`<span class="meta">Selfie yok</span>`}<figcaption>Selfie · beklenen kod <b class="kod-k">${esc(d.kod)}</b></figcaption></figure>
          <figure>${foto[d.id]?`<img src="${esc(foto[d.id])}" alt="Profil fotoğrafı">`:`<span class="meta">Profil fotoğrafı yok</span>`}<figcaption>Profil fotoğrafı</figcaption></figure>
        </div>
        <div class="row"><button class="btn" data-onay="${esc(d.id)}">Onayla</button>
          <select data-red="${esc(d.id)}" aria-label="Reddetme sebebi" style="width:auto;flex:1;min-width:180px"><option value="">Reddet…</option>${["Yüz net görünmüyor","Kod görünmüyor ya da yanlış","Profil fotoğrafıyla uyuşmuyor","Profil fotoğrafı yok"].map(r=>`<option>${r}</option>`).join("")}</select></div>
      </article>`;}).join("")}</div>`:`<p style="color:var(--muted)">Bekleyen doğrulama başvurusu yok.</p>`}
  </div>`;
  yonetimSekmeBagla();
  app.querySelectorAll("[data-onay]").forEach(b=>b.onclick=async()=>{ b.disabled=true; try{ await api.dogrulamaKarar(b.dataset.onay,"onay",null); toast("Onaylandı"); yonetimSayfa(); }catch(e){ toast(hataMetni(e)); b.disabled=false; } });
  app.querySelectorAll("[data-red]").forEach(s=>s.onchange=async()=>{ if(!s.value) return; try{ await api.dogrulamaKarar(s.dataset.red,"red",s.value); toast("Reddedildi"); yonetimSayfa(); }catch(e){ toast(hataMetni(e)); } });
}
function yonetimSekmeler(sekme,n){
  return `<div class="seg" role="tablist">
    <button data-s="acik" class="${sekme==="acik"?"on":""}">Şikayet (${n.acik})</button>
    <button data-s="kapali" class="${sekme==="kapali"?"on":""}">Kapalı (${n.kapali})</button>
    <button data-s="dogrulama" class="${sekme==="dogrulama"?"on":""}">Doğrulama (${n.dog})</button></div>`;
}
function yonetimSekmeBagla(){ app.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{ S.ySekme=b.dataset.s; yonetimSayfa(); }); }

// Sitede açık olduğunu bildir (kişi çevrimiçiyken e-posta gönderilmesin diye)
setInterval(()=>{ if(S.user && S.profil && document.visibilityState==="visible") api.goruldu().catch(()=>{}); }, 120000);
document.addEventListener("visibilitychange",()=>{ if(S.user && S.profil && document.visibilityState==="visible") api.goruldu().catch(()=>{}); });

function nasil(){
  app.innerHTML=`<div class="stack" style="gap:18px">
    <p class="eyebrow">Nasıl çalışır?</p>
    <h2>Basit ve açık bir yöntem.</h2>
    <p>Test sekiz konuda yedişer sorudan oluşur (toplam ${Q.length}). Hızlı test her konunun ilk üç sorusunu sorar. Her soruya 1 ile 5 arasında bir cevap verirsiniz.</p>
    <p>İki kişinin aynı soruya verdiği cevaplar arasındaki fark ölçülür. Aynı cevap tam puan, en uç iki cevap sıfır puan alır. Bir konunun puanı o konudaki ortak soruların ortalamasıdır. Genel uyum, konu puanlarının ortalamasıdır. Biri hızlı, diğeri kapsamlı testi çözdüyse yalnızca ikisinin de cevapladığı sorular sayılır.</p>
    <p>Üye olursanız adınız, yaşınız, şehriniz, tanıtım yazınız ve test cevaplarınız diğer üyelere gösterilir. İletişim bilginiz yalnızca siz ve karşı taraf birbirinize ilgi gönderdiğinizde açılır. Profilinizi istediğiniz zaman gizleyebilir ya da silebilirsiniz.</p>
    <p style="color:var(--muted)">Bu test bir sohbet başlatıcıdır, psikolojik bir ölçek değildir. Evlilik kararını bir puana bırakmayın; farklı çıktığınız konuları yüz yüze konuşun.</p>
    <div class="row"><a class="btn" href="#">Ana sayfa</a></div>
  </div>`;
}

async function oturumYukle(){
  try{ S.user=await api.oturum(); S.profil = S.user ? await api.profilim() : null; }
  catch(e){ S.user=null; S.profil=null; toast(hataMetni(e)); }
  if(S.profil && !S.cevap && gecerli(S.profil.cevap)) S.cevap=gecerli(S.profil.cevap);
  S.yonetici=false;
  if(S.user){ try{ S.yonetici=await api.yoneticiMi(); }catch(e){} cagriDinlemeyiBaslat(); mesajDinlemeyiBaslat(); okunmamisYukle(); }
  // Google dönüşünden sonra kullanıcıyı doğru sayfaya götür
  if(store.get("oauth")){ store.set("oauth",null); if(S.user) location.hash = S.profil ? "eslesmeler" : "profil"; }
}

async function render(){
  const h=location.hash.slice(1);
  navCiz(h);
  if(h!=="gorusme") gorusmeKapat();
  window.scrollTo(0,0);
  if(h==="anket") return S.liste.length?anket():(location.hash="");
  const v={sonuc, uyum:uyumSayfa, nasil, giris, profil:profilSayfa, eslesmeler, aday:adaySayfa, gorusme:gorusmeSayfa, mesajlar:mesajlarSayfa, sohbet:sohbetSayfa, yonetim:yonetimSayfa,
    aydinlatma:()=>yasalSayfa("aydinlatma"), riza:()=>yasalSayfa("riza"), kosullar:()=>yasalSayfa("kosullar")}[h];
  return (v||anaSayfa)();
}
$("#demo").hidden = !api.demo;
addEventListener("hashchange",render);
oturumYukle().then(render);
</script>
