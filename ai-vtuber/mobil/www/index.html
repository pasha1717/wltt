<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neşe</title>
<style>
  html, body { margin: 0; height: 100%; background: #2a1820; color: #fff; font: 17px/1.5 system-ui, sans-serif; }
  main { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; box-sizing: border-box; text-align: center; }
  .halka { width: 46px; height: 46px; border-radius: 50%; border: 5px solid #ff5c8a55; border-top-color: #ff5c8a; animation: don 0.9s linear infinite; }
  @keyframes don { to { transform: rotate(360deg); } }
  #hata { color: #ffb3c6; display: none; }
</style>
</head>
<body>
<main>
  <div class="halka" aria-hidden="true"></div>
  <div id="mesaj">Neşe başlıyor…</div>
  <div id="hata">Neşe'nin sunucusu açılmadı. Uygulamayı kapatıp yeniden aç.</div>
</main>
<script>
  // Gömülü Node, 127.0.0.1:3900'de sunucuyu açar; açılınca ayarlar ekranına geçilir.
  const bas = Date.now();
  async function bekle() {
    try {
      await fetch('http://127.0.0.1:3900/api/saglik', { mode: 'no-cors', cache: 'no-store' });
      location.replace('http://127.0.0.1:3900/ayarlar');
    } catch {
      if (Date.now() - bas > 60000) { document.querySelector('#hata').style.display = 'block'; return; }
      if (Date.now() - bas > 8000) document.querySelector('#mesaj').textContent = 'Neşe başlıyor… (ilk açılış biraz sürebilir)';
      setTimeout(bekle, 400);
    }
  }
  bekle();
</script>
</body>
</html>
